<!DOCTYPE html>
<html>
<head>
  <title>Elite Snake AI - A* + Safety + Debug</title>
  <style>
    body { background:#0b0f14; color:#e5e7eb; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; overflow:hidden; }
    #wrap { display:flex; gap:16px; align-items: flex-start; }
    canvas { border:2px solid #1f2933; background:#ffffff; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-radius: 8px; }
    .panel { font-family: 'Inter', -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, sans-serif; font-size:12px; line-height:1.4; width: 220px; background: rgba(31, 41, 51, 0.4); padding: 15px; border-radius: 12px; border: 1px solid #2d3748; }
    .badge { background:#0ea5e9; color: white; padding:4px 10px; border-radius:20px; font-weight: bold; margin-bottom:12px; display: inline-block; font-size: 10px; letter-spacing: 0.5px; }
    .stat-line { margin-bottom: 6px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
    .stat-val { color: #f8fafc; font-weight: bold; }
    .legend { margin-top: 15px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="240"></canvas>
  <div class="panel">
    <div class="badge">ELITE AI ENGINE v2.0</div>
    <div id="stats"></div>
    <div class="legend">
      <b>Visualization Matrix</b><br/>
      <div class="legend-item"><div class="dot" style="background:#065f46"></div><span>Snake Neural Core</span></div>
      <div class="legend-item"><div class="dot" style="background:#34d399"></div><span>Objective Node</span></div>
      <div class="legend-item"><div class="dot" style="background:rgba(59,130,246,0.6)"></div><span>A* Optimization Path</span></div>
      <div style="font-size: 10px; color: #94a3b8; margin-top: 10px;">Fallback: Recursive Flood-Fill Safety</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statsEl = document.getElementById("stats");

const cols = 20;
const rows = 12;
const cell = 20;
const SPEED = 65;

let snake, food, score, plannedPath;

function reset(){
  // Start in middle
  snake = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
  food = placeFood();
  score = 0;
  plannedPath = [];
}

function placeFood(){
  let f;
  do {
    f = {x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)};
  } while (snake.some(s=>s.x===f.x && s.y===f.y));
  return f;
}

// ---------- A* PATHFINDING ----------
function astar(start, goal, blocked){
  const key = p => p.x + "," + p.y;
  const open = [start];
  const came = {};
  const g = {[key(start)]:0};
  const f = {[key(start)]:heur(start,goal)};

  while(open.length){
    open.sort((a,b)=>f[key(a)]-f[key(b)]);
    const current = open.shift();
    if(current.x===goal.x && current.y===goal.y){
      return reconstruct(came, current);
    }
    for(const n of neighbors(current)){
      if(blocked(n)) continue;
      const nk = key(n);
      const tentative = g[key(current)] + 1;
      if(g[nk]===undefined || tentative < g[nk]){
        came[nk] = current;
        g[nk] = tentative;
        f[nk] = tentative + heur(n,goal);
        if(!open.some(o=>o.x===n.x && o.y===n.y)){
          open.push(n);
        }
      }
    }
  }
  return null;
}

function reconstruct(came, current){
  const path = [current];
  const key = p => p.x + "," + p.y;
  while(came[key(current)]){
    current = came[key(current)];
    path.push(current);
  }
  return path.reverse();
}

function heur(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }

function neighbors(p){
  return [
    {x:p.x+1,y:p.y},
    {x:p.x-1,y:p.y},
    {x:p.x,y:p.y+1},
    {x:p.x,y:p.y-1}
  ].filter(n=>n.x>=0&&n.y>=0&&n.x<cols&&n.y<rows);
}

// ---------- SAFETY ----------
function blockedCell(n){
  // Blocked if in snake body
  for(let i=0;i<snake.length-1;i++){
    if(snake[i].x===n.x && snake[i].y===n.y) return true;
  }
  return false;
}

// Flood fill to estimate free space
function floodFillCount(start, limit){
  const stack=[start];
  const seen = new Set([start.x+","+start.y]);
  let count=0;
  while(stack.length && count<limit){
    const p = stack.pop();
    count++;
    for(const n of neighbors(p)){
      const k=n.x+","+n.y;
      if(seen.has(k) || blockedCell(n)) continue;
      seen.add(k);
      stack.push(n);
    }
  }
  return count;
}

// ---------- AI DECISION CORE ----------
function computeMove(){
  const head = snake[0];
  plannedPath = [];

  // 1. Try A* to Food
  const path = astar(head, food, blockedCell);
  if(path && path.length>1){
    plannedPath = path;
    return {x:path[1].x-head.x, y:path[1].y-head.y};
  }

  // 2. Fallback: Survival (Move to cell with most free space)
  let best = null;
  let bestScore = -1;
  for(const n of neighbors(head)){
    if(blockedCell(n)) continue;
    const space = floodFillCount(n, 100);
    if(space > bestScore){
      bestScore = space;
      best = {x:n.x-head.x, y:n.y-head.y};
    }
  }
  
  if(best) return best;
  
  // 3. Absolute Fallback: Random move (will likely die)
  for(const n of neighbors(head)){
    if(!blockedCell(n)) return {x:n.x-head.x, y:n.y-head.y};
  }
  return {x:1, y:0};
}

// ---------- GAME ENGINE ----------
function step(){
  const move = computeMove();
  const head = {x:snake[0].x+move.x, y:snake[0].y+move.y};

  // Check collision
  if(head.x<0||head.y<0||head.x>=cols||head.y>=rows ||
     snake.some(s=>s.x===head.x && s.y===head.y)){
    reset();
    return;
  }

  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score++;
    food = placeFood();
  } else {
    snake.pop();
  }
  draw();
}

// ---------- RENDER ENGINE ----------
function draw(){
  // Clear with crisp background
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid
  ctx.beginPath();
  for(let x=0;x<=cols;x++){
    ctx.moveTo(x*cell,0);
    ctx.lineTo(x*cell,rows*cell);
  }
  for(let y=0;y<=rows;y++){
    ctx.moveTo(0,y*cell);
    ctx.lineTo(cols*cell,y*cell);
  }
  ctx.strokeStyle="#f1f5f9";
  ctx.stroke();

  // Draw Planned Path (A*)
  if(plannedPath && plannedPath.length > 0){
    ctx.fillStyle="rgba(59,130,246,0.35)";
    plannedPath.forEach(p=>{
      ctx.fillRect(p.x*cell,p.y*cell,cell,cell);
    });
  }

  // Food
  ctx.fillStyle="#10b981";
  ctx.beginPath();
  ctx.roundRect(food.x*cell+2, food.y*cell+2, cell-4, cell-4, 4);
  ctx.fill();

  // Snake
  snake.forEach((s, i)=>{
    ctx.fillStyle = i === 0 ? "#064e3b" : "#065f46";
    ctx.beginPath();
    ctx.roundRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2, 3);
    ctx.fill();
    
    // Eyes for head
    if(i === 0){
        ctx.fillStyle = "white";
        ctx.fillRect(s.x*cell+14, s.y*cell+4, 3, 3);
        ctx.fillRect(s.x*cell+14, s.y*cell+13, 3, 3);
    }
  });

  // UI Updates
  statsEl.innerHTML = `
    <div class="stat-line"><span>Iteration Score</span> <span class="stat-val">${score}</span></div>
    <div class="stat-line"><span>Neural Segments</span> <span class="stat-val">${snake.length}</span></div>
    <div class="stat-line"><span>Path Clarity</span> <span class="stat-val">${plannedPath.length > 0 ? 'High' : 'Computing...'}</span></div>
    <div class="stat-line"><span>Compute Path</span> <span class="stat-val">${plannedPath.length}px</span></div>
  `;
}

reset();
setInterval(step, SPEED);
draw();
</script>
</body>
</html>
