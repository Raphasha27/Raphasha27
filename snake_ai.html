<head>
  <title>Elite Snake AI - A* Pathfinding | Raphasha27</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta name="description" content="Elite Snake AI with A* pathfinding, flood-fill safety, and autonomous gameplay by Koketso Raphasha.">
  <style>
    body {
      background: #0b0f14;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    #wrap {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    canvas {
      border: 2px solid #1f2933;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);

    }

    .panel {
      font-family: 'Inter', -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, sans-serif;
      font-size: 12px;

    }

    .badge {
      background: #0ea5e9;

    }
  </style>
<style>/* Universal Responsive & Watermark Fixes */ html, body { overflow-x: hidden !important; max-width: 100vw !important; width: 100% !important; } * { box-sizing: border-box !important; } img, video, canvas, svg, iframe { max-width: 100% !important; } .trial-badge, .watermark, #watermark { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>

<body>
  <nav style="position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:rgba(11,15,20,0.85);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.08);">
    <a href="index.html" style="font-weight:800;font-size:1.2rem;background:linear-gradient(135deg,#0ea5e9,#00f2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;">RAPHASHA.AI</a>
    <a href="index.html" style="color:#94a3b8;text-decoration:none;border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:0.5rem 1rem;font-size:0.85rem;">Back to Portfolio</a>
  </nav>
  <div id="wrap" style="margin-top:40px;">
    <canvas id="game" width="400" height="240"></canvas>
    <div class="panel">
      <div class="badge">ELITE AI ENGINE v2.0</div>
      <div id="stats"></div>
      <div class="legend">
        <b>Visualization Matrix</b><br />
        <div class="legend-item">
          <div class="dot" style="background:#065f46"></div><span>Snake Neural Core</span>
        </div>
        <div class="legend-item">
          <div class="dot" style="background:#10b981"></div><span>Objective Node</span>
        </div>
        <div class="legend-item">
          <div class="dot" style="background:rgba(59,130,246,0.6)"></div><span>A* Optimization Path</span>
        </div>
        <div style="font-size: 10px; color: #94a3b8; margin-top: 10px;">Fallback: Recursive Flood-Fill Safety</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statsEl = document.getElementById("stats");

    const cols = 20;
    const rows = 12;
    const cell = 20;
    const SPEED = 50;

    let snake = [];
    let food = {};
    let score = 0;
    let plannedPath = [];
    let algorithmState = "A* Optimal";

    // Initialize Game
    function reset() {
      snake = [{ x: 5, y: 5 }, { x: 4, y: 5 }, { x: 3, y: 5 }];
      score = 0;
      placeFood();
      plannedPath = [];
    }

    // Place Food Randomly (not on snake)
    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * cols),
          y: Math.floor(Math.random() * rows)
        };
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
    }

    // ---------------- ALGORITHM CORE ----------------

    // 1. Heuristic (Manhattan Distance)
    function heuristic(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    // 2. Neighbors (Up, Down, Left, Right)
    function getNeighbors(node) {
      const dirs = [
        { x: 0, y: -1 }, { x: 0, y: 1 },
        { x: -1, y: 0 }, { x: 1, y: 0 }
      ];
      return dirs.map(d => ({ x: node.x + d.x, y: node.y + d.y }));
    }

    // 3. Collision Check
    function isBlocked(node, ignoreTail = false) {
      // Walls
      if (node.x < 0 || node.x >= cols || node.y < 0 || node.y >= rows) return true;

      // Snake Body
      // We ignore the tail if we are NOT growing, because the tail will move.
      // However, for robust safety, treating the tail as blocked is safer.
      // Let's treat full snake as blocked for A* to ensure we don't trap ourselves.
      for (let i = 0; i < snake.length; i++) {
        if (ignoreTail && i === snake.length - 1) continue;
        if (node.x === snake[i].x && node.y === snake[i].y) return true;
      }
      return false;
    }

    // 4. A* Pathfinding
    function findPath(start, target) {
      const openSet = [start];
      const cameFrom = new Map();
      const gScore = new Map();
      const fScore = new Map();

      const key = n => `${n.x},${n.y}`;

      gScore.set(key(start), 0);
      fScore.set(key(start), heuristic(start, target));

      while (openSet.length > 0) {
        // Get node with lowest fScore
        openSet.sort((a, b) => (fScore.get(key(a)) || Infinity) - (fScore.get(key(b)) || Infinity));
        const current = openSet.shift();

        if (current.x === target.x && current.y === target.y) {
          return reconstructPath(cameFrom, current);
        }

        for (const neighbor of getNeighbors(current)) {
          if (isBlocked(neighbor)) continue;

          const tentativeG = (gScore.get(key(current)) || Infinity) + 1;

          if (tentativeG < (gScore.get(key(neighbor)) || Infinity)) {
            cameFrom.set(key(neighbor), current);
            gScore.set(key(neighbor), tentativeG);
            fScore.set(key(neighbor), tentativeG + heuristic(neighbor, target));

            if (!openSet.some(n => n.x === neighbor.x && n.y === neighbor.y)) {
              openSet.push(neighbor);
            }
          }
        }
      }
      return null; // No path found
    }

    function reconstructPath(cameFrom, current) {
      const totalPath = [current];
      const key = n => `${n.x},${n.y}`;
      while (cameFrom.has(key(current))) {
        current = cameFrom.get(key(current));
        totalPath.unshift(current);
      }
      return totalPath;
    }

    // 5. Flood Fill (Safety Check)
    function countFreeSpace(startNode, depth = 100) {
      const stack = [startNode];
      const visited = new Set();
      visited.add(`${startNode.x},${startNode.y}`);
      let count = 0;

      while (stack.length > 0 && count < depth) {
        const current = stack.pop();
        count++;

        for (const neighbor of getNeighbors(current)) {
          const k = `${neighbor.x},${neighbor.y}`;
          if (!isBlocked(neighbor) && !visited.has(k)) {
            visited.add(k);
            stack.push(neighbor);
          }
        }
      }
      return count;
    }

    // ---------------- AI LOGIC ----------------

    function getNextMove() {
      const head = snake[0];

      // Strategy 1: A* to Food
      const path = findPath(head, food);

      if (path && path.length > 1) {
        // Check safety of the path (simplified)
        // If we follow this, will we be trapped?
        // In a real elite AI, we would check if path endpoint leaves room to reach tail.
        // For this demo, A* + flood fill fallback is usually sufficient.
        plannedPath = path;
        algorithmState = "A* Optimal";
        return { x: path[1].x - head.x, y: path[1].y - head.y };
      }

      // Strategy 2: Fallback - Gradient Descent / Flood Fill
      // If A* fails (e.g., path blocked by body), pick the neighbor with most free space
      plannedPath = [];
      algorithmState = "Safety Fallback";

      let bestMove = null;
      let maxSpace = -1;

      for (const neighbor of getNeighbors(head)) {
        if (isBlocked(neighbor)) continue;

        const space = countFreeSpace(neighbor);
        if (space > maxSpace) {
          maxSpace = space;
          bestMove = { x: neighbor.x - head.x, y: neighbor.y - head.y };
        }
      }

      if (bestMove) return bestMove;

      // Strategy 3: Last Resort (Any valid move)
      for (const neighbor of getNeighbors(head)) {
        if (!isBlocked(neighbor)) {
          algorithmState = "Desperation";
          return { x: neighbor.x - head.x, y: neighbor.y - head.y };
        }
      }

      return { x: 1, y: 0 }; // Suicide move
    }

    // ---------------- GAME LOOP ----------------

    function update() {
      const move = getNextMove();
      const newHead = { x: snake[0].x + move.x, y: snake[0].y + move.y };

      // Collision Death Check
      if (isBlocked(newHead)) {
        reset();
        return;
      }

      // Move Snake
      snake.unshift(newHead);

      // Check Eat
      if (newHead.x === food.x && newHead.y === food.y) {
        score++;
        placeFood();
        // Don't pop tail (grow)
      } else {
        snake.pop(); // Remove tail
      }

      draw();
    }

    function draw() {
      // Clear
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid (Subtle)
      ctx.beginPath();
      ctx.strokeStyle = "#f3f4f6";
      ctx.lineWidth = 1;
      for (let x = 0; x <= cols; x++) ctx.moveTo(x * cell, 0), ctx.lineTo(x * cell, rows * cell);
      for (let y = 0; y <= rows; y++) ctx.moveTo(0, y * cell), ctx.lineTo(cols * cell, y * cell);
      ctx.stroke();

      // Draw Path (Visual Debug)
      if (plannedPath.length > 1) {
        ctx.fillStyle = "rgba(59, 130, 246, 0.2)";
        for (let i = 1; i < plannedPath.length; i++) {
          ctx.fillRect(plannedPath[i].x * cell, plannedPath[i].y * cell, cell, cell);
        }
      }

      // Draw Food
      ctx.fillStyle = "#10b981";
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(food.x * cell + 3, food.y * cell + 3, cell - 6, cell - 6, 4);
      } else {
        ctx.fillRect(food.x * cell + 3, food.y * cell + 3, cell - 6, cell - 6);
      }
      ctx.fill();

      // Draw Snake
      for (let i = 0; i < snake.length; i++) {
        const s = snake[i];
        ctx.fillStyle = i === 0 ? "#064e3b" : "#059669"; // Dark head, green body

        const margin = 1;
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(s.x * cell + margin, s.y * cell + margin, cell - margin * 2, cell - margin * 2, 4);
          ctx.fill();
        } else {
          ctx.fillRect(s.x * cell + margin, s.y * cell + margin, cell - margin * 2, cell - margin * 2);
        }

        // Eyes for Head
        if (i === 0) {
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(s.x * cell + 6, s.y * cell + 6, 2, 0, Math.PI * 2);
          ctx.arc(s.x * cell + 14, s.y * cell + 6, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Update Stats Panel
      statsEl.innerHTML = `
    <div class="stat-line"><span>Iteration Score</span> <span class="stat-val">${score}</span></div>
    <div class="stat-line"><span>Neural Segments</span> <span class="stat-val">${snake.length}</span></div>
    <div class="stat-line"><span>Algorithm</span> <span class="stat-val" style="color:${algorithmState === 'A* Optimal' ? '#4ade80' : '#fbbf24'}">${algorithmState}</span></div>
    <div class="stat-line"><span>Compute Path</span> <span class="stat-val">${plannedPath.length} nodes</span></div>
  `;
    }

    // Start
    reset();
    setInterval(update, SPEED);
  </script>
</body>

</html>
