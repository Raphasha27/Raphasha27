<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man AI Hunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ea5e9;
      --secondary: #2121de;
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.7);
      --text: #f8fafc;
      --neon-blue: #00f2ff;
      --neon-yellow: #fff200;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      text-align: center; 
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient Background blobs */
    .blob {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(33, 33, 222, 0) 70%);
      border-radius: 50%;
      z-index: -1;
      filter: blur(80px);
      animation: float 20s infinite alternate;
    }
    @keyframes float {
      from { transform: translate(-20%, -20%); }
      to { transform: translate(20%, 20%); }
    }

    h1 { 
      font-size: 3em; 
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 5px;
      background: linear-gradient(135deg, #fff, var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(14, 165, 233, 0.3);
    }

    .subtitle { color: var(--primary); font-size: 0.95em; margin-bottom: 25px; opacity: 0.8; }

    .stats { 
      display: flex; 
      gap: 15px; 
      margin-bottom: 25px;
      perspective: 1000px;
    }

    .stat { 
      padding: 12px 20px; 
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; 
      font-weight: 700;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
    }
    .stat:hover { transform: translateY(-5px) rotateX(10deg); }
    .stat span { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

    canvas { 
      background: #000; 
      border: 2px solid var(--secondary);
      border-radius: 12px;
      box-shadow: 0 0 50px rgba(33, 33, 222, 0.4), inset 0 0 20px rgba(33, 33, 222, 0.2);
      image-rendering: pixelated;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    button {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9em;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    button:hover { 
      background: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(14, 165, 233, 0.4);
    }

    .d-pad {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .d-pad-row { display: flex; gap: 8px; }
    .d-pad button {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 1.4em;
    }

    .info { 
      margin-top: 30px; 
      color: #94a3b8; 
      font-size: 0.9em;
      max-width: 450px;
      line-height: 1.6;
    }
    .info b { color: var(--primary); }

    /* Scanlines */
    .scanlines {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
      opacity: 0.2;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
    .power-pellet {
      animation: pulse 0.5s infinite;
    }
  </style>
</head>
<body>
  <div class="blob"></div>
  <div class="scanlines"></div>
  <h1>🟡 Pac-Man AI Hunter</h1>
  <p class="subtitle">Neural Pathfinding & Coordinated Ghost Swarm</p>
  
  <div class="stats">
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">High Score: <span id="highScore">0</span></div>
    <div class="stat">Catches: <span id="catches">0</span></div>
    <div class="stat">Time: <span id="time">0</span>s</div>
  </div>
  
  <canvas id="game" width="420" height="220"></canvas>
  
  <div class="controls">
    <button onclick="toggleAI()">Toggle AI: <span id="aiStatus">ON</span></button>
    <button onclick="resetGame()">Reset Game</button>
    <button onclick="toggleDebug()">Debug: <span id="debugStatus">OFF</span></button>
  </div>
  
  <div class="d-pad">
    <button onclick="manualMove(0, -1)">⬆️</button>
    <div class="d-pad-row">
      <button onclick="manualMove(-1, 0)">⬅️</button>
      <button onclick="manualMove(1, 0)">➡️</button>
    </div>
    <button onclick="manualMove(0, 1)">⬇️</button>
  </div>
  
  <p class="info">
    🧠 This system combines <b>Classical Grid AI</b> with <b>Unique Ghost Personalities</b> (Blinky, Pinky, Inky, Clyde) to create a high-fidelity arcade simulation. 
  </p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const TILE = 20;

// Game State
let score = 0;
let highScore = localStorage.getItem("pacman_highscore") || 0;
let catches = 0;
let gameTime = 0;
let aiEnabled = true;
let debugMode = false;
let powerTimer = 0;
let particles = [];
let gameRunning = true;
let modeTimer = 0;
let currentMode = 'CHASE'; // SCATTER or CHASE

// Map: # = wall, . = dot, space = empty, O = power
const mapTemplate = [
  "#####################",
  "#O........#........O#",
  "#.###.###.#.###.###.#",
  "#...................#",
  "#.###.#.#####.#.###.#",
  "#.....#...#...#.....#",
  "#####.###.#.###.#####",
  "#...................#",
  "#.###.###.#.###.###.#",
  "#O........#........O#",
  "#####################"
];

let map = mapTemplate.map(row => row.split(''));
const ROWS = map.length;
const COLS = map[0].length;

// Movement Helpers
const DIRS = {
  UP: { x: 0, y: -1, angle: -Math.PI/2 },
  DOWN: { x: 0, y: 1, angle: Math.PI/2 },
  LEFT: { x: -1, y: 0, angle: Math.PI },
  RIGHT: { x: 1, y: 0, angle: 0 }
};

// Precise Entity Class
class Entity {
  constructor(x, y, speed, color) {
    this.gridX = x;
    this.gridY = y;
    this.x = x * TILE + TILE / 2;
    this.y = y * TILE + TILE / 2;
    this.speed = speed;
    this.color = color;
    this.dir = DIRS.RIGHT;
    this.nextDir = null;
    this.radius = 9;
  }

  isAtCenter() {
    const centerX = this.gridX * TILE + TILE / 2;
    const centerY = this.gridY * TILE + TILE / 2;
    return Math.abs(this.x - centerX) < this.speed && Math.abs(this.y - centerY) < this.speed;
  }

  canMove(dir) {
    const nx = this.gridX + dir.x;
    const ny = this.gridY + dir.y;
    // Tunnel Warp
    if (nx < 0 || nx >= COLS) return true; 
    return map[ny] && map[ny][nx] !== '#';
  }

  update() {
    // 1. Try to turn if we have a nextDir
    if (this.nextDir && this.isAtCenter()) {
      if (this.canMove(this.nextDir)) {
        this.dir = this.nextDir;
        this.nextDir = null;
        // Snap to center when turning
        this.x = this.gridX * TILE + TILE/2;
        this.y = this.gridY * TILE + TILE/2;
      }
    }

    // 2. Stop if hitting a wall at center
    if (this.isAtCenter() && !this.canMove(this.dir)) {
      this.x = this.gridX * TILE + TILE/2;
      this.y = this.gridY * TILE + TILE/2;
      return;
    }

    // 3. Move
    this.x += this.dir.x * this.speed;
    this.y += this.dir.y * this.speed;

    // 4. Update Grid Position
    this.gridX = Math.floor(this.x / TILE);
    this.gridY = Math.floor(this.y / TILE);

    // 5. Tunnel Warp
    if (this.x < -TILE/2) this.x = COLS * TILE + TILE/2;
    if (this.x > COLS * TILE + TILE/2) this.x = -TILE/2;
  }
}

let pacmanEntity = new Entity(1, 1, 2, "#ffff00");

// Ghost Logic (Classic AI)
class Ghost extends Entity {
  constructor(x, y, speed, color, name, scatterTarget) {
    super(x, y, speed, color);
    this.name = name;
    this.state = 'CHASE';
    this.scatterTarget = scatterTarget;
    this.target = { x: 0, y: 0 };
  }

  updateAI(pacman) {
    if (!this.isAtCenter()) return;

    // Determine State and Target
    if (powerTimer > 0) {
      this.state = 'FRIGHTENED';
      this.target = { x: Math.random() * COLS, y: Math.random() * ROWS };
    } else if (currentMode === 'SCATTER') {
      this.state = 'SCATTER';
      this.target = this.scatterTarget;
    } else {
      this.state = 'CHASE';
      this.setChaseTarget(pacman);
    }

    // Classic Greedy Pathfinding: Choose best valid direction
    const possibleDirs = [DIRS.UP, DIRS.LEFT, DIRS.DOWN, DIRS.RIGHT].filter(d => {
      // Cannot reverse back unless forced
      const isReverse = d.x === -this.dir.x && d.y === -this.dir.y;
      return this.canMove(d) && !isReverse;
    });

    if (possibleDirs.length > 0) {
      this.dir = possibleDirs.reduce((best, curr) => {
        const d1 = Math.pow(this.gridX + best.x - this.target.x, 2) + Math.pow(this.gridY + best.y - this.target.y, 2);
        const d2 = Math.pow(this.gridX + curr.x - this.target.x, 2) + Math.pow(this.gridY + curr.y - this.target.y, 2);
        return d2 < d1 ? curr : best;
      });
    }
  }

  setChaseTarget(pacman) {
    // Polished Ghost logic will go here
    this.target = { x: pacman.gridX, y: pacman.gridY };
  }
}

// Custom Ghost Brains
class Blinky extends Ghost { setChaseTarget(p) { this.target = { x: p.gridX, y: p.gridY }; } }
class Pinky extends Ghost { setChaseTarget(p) { this.target = { x: p.gridX + p.dir.x * 4, y: p.gridY + p.dir.y * 4 }; } }
class Inky extends Ghost {
  setChaseTarget(p) {
    const blinky = ghosts[0];
    const tx = p.gridX + p.dir.x * 2;
    const ty = p.gridY + p.dir.y * 2;
    this.target = { x: tx + (tx - blinky.gridX), y: ty + (ty - blinky.gridY) };
  }
}
class Clyde extends Ghost {
  setChaseTarget(p) {
    const dist = Math.sqrt(Math.pow(this.gridX - p.gridX, 2) + Math.pow(this.gridY - p.gridY, 2));
    this.target = dist > 8 ? { x: p.gridX, y: p.gridY } : this.scatterTarget;
  }
}

let ghosts = [
  new Blinky(19, 1, 1.8, "#ff0000", "Blinky", {x: 19, y: 0}),
  new Pinky(19, 9, 1.5, "#ffb8ff", "Pinky", {x: 0, y: 0}),
  new Inky(1, 9, 1.6, "#00ffff", "Inky", {x: 19, y: 10}),
  new Clyde(10, 5, 1.4, "#ffb852", "Clyde", {x: 0, y: 10})
];

function checkPellets() {
  const gx = pacmanEntity.gridX;
  const gy = pacmanEntity.gridY;
  if (map[gy] && map[gy][gx] === '.') {
    map[gy][gx] = ' ';
    score += 10;
    createParticles(pacmanEntity.x, pacmanEntity.y, "#ffb8ae");
  } else if (map[gy] && map[gy][gx] === 'O') {
    map[gy][gx] = ' ';
    score += 50;
    powerTimer = 500; // Longer timer for smooth eng
    createParticles(pacmanEntity.x, pacmanEntity.y, "#fff");
  }
}

function checkCollisions() {
  for (let g of ghosts) {
    const dist = Math.sqrt(Math.pow(pacmanEntity.x - g.x, 2) + Math.pow(pacmanEntity.y - g.y, 2));
    if (dist < TILE) {
      if (powerTimer > 0) {
        catches++;
        score += 200;
        createParticles(g.x, g.y, "#0ff");
        g.x = 10 * TILE + TILE/2; g.y = 5 * TILE + TILE/2; // Return to house
      } else {
        createParticles(pacmanEntity.x, pacmanEntity.y, "#ff0");
        resetGame();
      }
    }
  }
}

function createParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 1.0,
      color
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= 0.05;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Draw Map
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const cell = map[y][x];
      if (cell === '#') {
        ctx.fillStyle = "#2121de"; // Solid Blue Wall
        ctx.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);
      } else if (cell === '.') {
        ctx.fillStyle = "#ffb8ae";
        ctx.beginPath();
        ctx.arc(x * TILE + TILE/2, y * TILE + TILE/2, 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (cell === 'O') {
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        const pulse = Math.sin(Date.now() / 150) * 2;
        ctx.arc(x * TILE + TILE/2, y * TILE + TILE/2, 5 + pulse, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  
  // Draw Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1.0;

  // Draw Ghosts
  for (let g of ghosts) {
    ctx.fillStyle = powerTimer > 0 ? (powerTimer < 100 && Math.floor(Date.now()/200) % 2 ? "#fff" : "#2121de") : g.color;
    ctx.beginPath();
    ctx.arc(g.x, g.y - 2, 8, Math.PI, 0);
    ctx.lineTo(g.x + 8, g.y + 6);
    ctx.lineTo(g.x - 8, g.y + 6);
    ctx.fill();
  }

  // Draw Pacman
  ctx.fillStyle = "#ffff00";
  ctx.beginPath();
  const mouthAngle = Math.abs(Math.sin(Date.now() / 100)) * 0.4;
  ctx.arc(pacmanEntity.x, pacmanEntity.y, 9, pacmanEntity.dir.angle + mouthAngle, pacmanEntity.dir.angle + Math.PI * 2 - mouthAngle);
  ctx.lineTo(pacmanEntity.x, pacmanEntity.y);
  ctx.fill();
  
  // Stats
  document.getElementById("score").textContent = score;
  document.getElementById("catches").textContent = catches;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("pacman_highscore", highScore);
  }
  document.getElementById("highScore").textContent = highScore;
}

function gameLoop() {
  if (!gameRunning) return;
  
  if (powerTimer > 0) powerTimer--;
  
  // Mode Timer (7s Scatter, 20s Chase)
  modeTimer++;
  if (currentMode === 'SCATTER' && modeTimer > 600) { currentMode = 'CHASE'; modeTimer = 0; }
  if (currentMode === 'CHASE' && modeTimer > 1600) { currentMode = 'SCATTER'; modeTimer = 0; }
  
  if (aiEnabled) {
    // Simple Hunter AI for Pacman (Nearest Target)
    if (pacmanEntity.isAtCenter()) {
      let nearest = ghosts[0];
      let minDist = Infinity;
      for(let g of ghosts) {
        let d = Math.abs(g.gridX - pacmanEntity.gridX) + Math.abs(g.gridY - pacmanEntity.gridY);
        if (d < minDist) { minDist = d; nearest = g; }
      }
      const path = aStar({x: pacmanEntity.gridX, y: pacmanEntity.gridY}, {x: nearest.gridX, y: nearest.gridY});
      if (path.length > 1) {
        const next = path[1];
        if (next.x > pacmanEntity.gridX) pacmanEntity.nextDir = DIRS.RIGHT;
        else if (next.x < pacmanEntity.gridX) pacmanEntity.nextDir = DIRS.LEFT;
        else if (next.y > pacmanEntity.gridY) pacmanEntity.nextDir = DIRS.DOWN;
        else if (next.y < pacmanEntity.gridY) pacmanEntity.nextDir = DIRS.UP;
      }
    }
  }
  
  pacmanEntity.update();
  checkPellets();
  
  for (let g of ghosts) {
    g.updateAI(pacmanEntity);
    g.update();
  }
  
  checkCollisions();
  draw();
  requestAnimationFrame(gameLoop);
}

// ... (existing aStar, toggle, reset functions updated for Entity classes) ...

function toggleAI() {
  aiEnabled = !aiEnabled;
  document.getElementById("aiStatus").textContent = aiEnabled ? "ON" : "OFF";
}

function resetGame() {
  score = 0;
  catches = 0;
  powerTimer = 0;
  map = mapTemplate.map(row => row.split(''));
  pacmanEntity = new Entity(1, 1, 2, "#ffff00");
  ghosts = [
    new Blinky(19, 1, 1.8, "#ff0000", "Blinky", {x: 19, y: 0}),
    new Pinky(19, 9, 1.5, "#ffb8ff", "Pinky", {x: 0, y: 0}),
    new Inky(1, 9, 1.6, "#00ffff", "Inky", {x: 19, y: 10}),
    new Clyde(10, 5, 1.4, "#ffb852", "Clyde", {x: 0, y: 10})
  ];
}

function manualMove(dx, dy) {
  if (aiEnabled) toggleAI();
  if (dx === 1) pacmanEntity.nextDir = DIRS.RIGHT;
  if (dx === -1) pacmanEntity.nextDir = DIRS.LEFT;
  if (dy === 1) pacmanEntity.nextDir = DIRS.DOWN;
  if (dy === -1) pacmanEntity.nextDir = DIRS.UP;
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") manualMove(0, -1);
  if (e.key === "ArrowDown") manualMove(0, 1);
  if (e.key === "ArrowLeft") manualMove(-1, 0);
  if (e.key === "ArrowRight") manualMove(1, 0);
});

// A* implementation for AI mode (must maintain for Hunter mode)
function heuristic(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
function aStar(start, goal) {
  const openSet = [start];
  const cameFrom = new Map();
  const gScore = new Map();
  const fScore = new Map();
  const key = (n) => `${n.x},${n.y}`;
  gScore.set(key(start), 0);
  fScore.set(key(start), heuristic(start, goal));
  while (openSet.length > 0) {
    openSet.sort((a, b) => (fScore.get(key(a)) || Infinity) - (fScore.get(key(b)) || Infinity));
    const current = openSet.shift();
    if (current.x === goal.x && current.y === goal.y) {
      const path = [current];
      let curr = current;
      while (cameFrom.has(key(curr))) { curr = cameFrom.get(key(curr)); path.unshift(curr); }
      return path;
    }
    const neighbors = [DIRS.UP, DIRS.DOWN, DIRS.LEFT, DIRS.RIGHT].map(d => ({x: current.x + d.x, y: current.y + d.y}))
      .filter(n => n.y >= 0 && n.y < ROWS && n.x >= 0 && n.x < COLS && map[n.y][n.x] !== '#');
    for (const neighbor of neighbors) {
      const tentG = (gScore.get(key(current)) || Infinity) + 1;
      if (tentG < (gScore.get(key(neighbor)) || Infinity)) {
        cameFrom.set(key(neighbor), current);
        gScore.set(key(neighbor), tentG);
        fScore.set(key(neighbor), tentG + heuristic(neighbor, goal));
        if (!openSet.some(n => n.x === neighbor.x && n.y === neighbor.y)) openSet.push(neighbor);
      }
    }
  }
  return [];
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
