<!DOCTYPE html>
<html>
<head>
  <title>Simple Pac-Man</title>
  <style>
    body { background: black; color: yellow; text-align: center; font-family: Arial; }
    canvas { background: #000; border: 2px solid yellow; }
  </style>
</head>
<body>
  <h1>Pac-Man</h1>
  <p>Use Arrow Keys</p>
  <h2 id="score">Score: 0</h2>
  <canvas id="game" width="420" height="420"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const tile = 20;
let score = 0;

const map = [
 "#####################",
 "#.........##........#",
 "#.###.###..##..###.###",
 "#...................#",
 "#.###.#.######.#.###.#",
 "#.....#....##....#...#",
 "#####.#######.####.###",
 "#...................#",
 "#.###.###..##..###.###",
 "#.........##........#",
 "#####################"
];

let pacman = { x: 1, y: 1, dx: 0, dy: 0 };
let ghost = { x: 10, y: 5 };

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp")    { pacman.dx=0; pacman.dy=-1; }
  if (e.key === "ArrowDown")  { pacman.dx=0; pacman.dy=1; }
  if (e.key === "ArrowLeft")  { pacman.dx=-1; pacman.dy=0; }
  if (e.key === "ArrowRight") { pacman.dx=1; pacman.dy=0; }
});

function drawMap() {
  for (let y=0; y<map.length; y++) {
    for (let x=0; x<map[y].length; x++) {
      if (map[y][x] === "#") {
        ctx.fillStyle = "blue";
        ctx.fillRect(x*tile, y*tile, tile, tile);
      } else if (map[y][x] === ".") {
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(x*tile+10, y*tile+10, 3, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
}

function movePacman() {
  let nx = pacman.x + pacman.dx;
  let ny = pacman.y + pacman.dy;

  if (map[ny] && map[ny][nx] !== "#") {
    pacman.x = nx;
    pacman.y = ny;

    if (map[ny][nx] === ".") {
      score += 10;
      document.getElementById("score").innerText = "Score: " + score;
      // Replace dot with empty space using array manipulation
      let row = map[ny].split('');
      row[nx] = ' ';
      map[ny] = row.join('');
    }
  }
}

function moveGhost() {
  const dirs = [
    {x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}
  ];
  let d = dirs[Math.floor(Math.random()*4)];
  let nx = ghost.x + d.x;
  let ny = ghost.y + d.y;

  if (map[ny] && map[ny][nx] !== "#") {
    ghost.x = nx;
    ghost.y = ny;
  }
}

function drawCharacters() {
  // Pac-Man
  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(pacman.x*tile+10, pacman.y*tile+10, 9, 0.2, Math.PI*1.8);
  ctx.lineTo(pacman.x*tile+10, pacman.y*tile+10);
  ctx.fill();

  // Ghost
  ctx.fillStyle = "red";
  ctx.fillRect(ghost.x*tile+3, ghost.y*tile+3, 14, 14);
}

function checkCollision() {
  if (pacman.x === ghost.x && pacman.y === ghost.y) {
    alert("GAME OVER! Score: " + score);
    location.reload();
  }
}

function gameLoop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawMap();
  movePacman();
  if (Math.random() < 0.3) moveGhost();
  drawCharacters();
  checkCollision();
}

setInterval(gameLoop, 150);
</script>
</body>
</html>
