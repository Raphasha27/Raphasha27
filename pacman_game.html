<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man AI Hunter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      color: yellow; 
      text-align: center; 
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { 
      font-size: 2.5em; 
      margin-bottom: 10px;
      text-shadow: 0 0 20px #ff0;
    }
    .subtitle { color: #0ff; font-size: 0.9em; margin-bottom: 15px; }
    .stats { 
      display: flex; 
      gap: 30px; 
      margin-bottom: 15px;
      font-size: 1.1em;
    }
    .stat { padding: 8px 15px; background: #111; border-radius: 8px; }
    .stat span { color: #0f0; }
    canvas { 
      background: #000; 
      border: 3px solid #2121de;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(33, 33, 222, 0.5);
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      background: #2121de;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover { background: #3434ff; }
    .info { 
      margin-top: 15px; 
      color: #888; 
      font-size: 0.85em;
      max-width: 420px;
    }
    .mode-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .ai-status { color: #0f0; }
    
    /* Retro Scanline Effect */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 100;
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
      opacity: 0.3;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
    .power-pellet {
      animation: pulse 0.5s infinite;
    }
  </style>
</head>
<body>
  <h1>🎮 Pac-Man AI Hunter</h1>
  <p class="subtitle">Intelligent A* Pathfinding • Real-Time Target Tracking</p>
  
  <div class="stats">
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">High Score: <span id="highScore">0</span></div>
    <div class="stat">Catches: <span id="catches">0</span></div>
    <div class="stat">Time: <span id="time">0</span>s</div>
  </div>
  
  <canvas id="game" width="420" height="220"></canvas>
  
  <div class="controls">
    <button onclick="toggleAI()">Toggle AI: <span id="aiStatus">ON</span></button>
    <button onclick="resetGame()">Reset Game</button>
    <button onclick="toggleDebug()">Debug: <span id="debugStatus">OFF</span></button>
  </div>
  
  <div class="d-pad">
    <button onclick="manualMove(0, -1)">⬆️</button>
    <div class="d-pad-row">
      <button onclick="manualMove(-1, 0)">⬅️</button>
      <button onclick="manualMove(1, 0)">➡️</button>
    </div>
    <button onclick="manualMove(0, 1)">⬇️</button>
  </div>
  
  <style>
    .d-pad {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .d-pad-row {
      display: flex;
      gap: 5px;
    }
    .d-pad button {
      width: 50px;
      height: 50px;
      font-size: 1.5em;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #333;
      border: 2px solid #555;
    }
    .d-pad button:active { background: #555; }
  </style>
  
  <p class="info">
    🧠 Pac-Man uses <b>A* pathfinding</b> to hunt the red ghost in real-time.
    The ghost has evasive AI and tries to escape. Watch the chase unfold!
  </p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const TILE = 20;

// Game State
let score = 0;
let highScore = localStorage.getItem("pacman_highscore") || 0;
let catches = 0;
let gameTime = 0;
let aiEnabled = true;
let debugMode = false;
let currentPath = [];
let powerTimer = 0;
let particles = [];

// Map: # = wall, . = dot, space = empty
const mapTemplate = [
  "#####################",
  "#O........#........O#",
  "#.###.###.#.###.###.#",
  "#...................#",
  "#.###.#.#####.#.###.#",
  "#.....#...#...#.....#",
  "#####.###.#.###.#####",
  "#...................#",
  "#.###.###.#.###.###.#",
  "#O........#........O#",
  "#####################"
];

let map = mapTemplate.map(row => row.split(''));
const ROWS = map.length;
const COLS = map[0].length;

// Entities
let pacman = { x: 1, y: 1, dx: 0, dy: 0 };

// A* Pathfinding
function heuristic(a, b) {
  return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
}

function getNeighbors(node) {
  const dirs = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}];
  const neighbors = [];
  for (const d of dirs) {
    const nx = node.x + d.x;
    const ny = node.y + d.y;
    if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS && map[ny][nx] !== '#') {
      neighbors.push({x: nx, y: ny});
    }
  }
  return neighbors;
}

function aStar(start, goal) {
  const openSet = [start];
  const cameFrom = new Map();
  const gScore = new Map();
  const fScore = new Map();
  
  const key = (n) => `${n.x},${n.y}`;
  gScore.set(key(start), 0);
  fScore.set(key(start), heuristic(start, goal));
  
  while (openSet.length > 0) {
    // Get node with lowest fScore
    openSet.sort((a, b) => (fScore.get(key(a)) || Infinity) - (fScore.get(key(b)) || Infinity));
    const current = openSet.shift();
    
    if (current.x === goal.x && current.y === goal.y) {
      // Reconstruct path
      const path = [current];
      let curr = current;
      while (cameFrom.has(key(curr))) {
        curr = cameFrom.get(key(curr));
        path.unshift(curr);
      }
      return path;
    }
    
    for (const neighbor of getNeighbors(current)) {
      const tentativeG = (gScore.get(key(current)) || Infinity) + 1;
      
      if (tentativeG < (gScore.get(key(neighbor)) || Infinity)) {
        cameFrom.set(key(neighbor), current);
        gScore.set(key(neighbor), tentativeG);
        fScore.set(key(neighbor), tentativeG + heuristic(neighbor, goal));
        
        if (!openSet.some(n => n.x === neighbor.x && n.y === neighbor.y)) {
          openSet.push(neighbor);
        }
      }
    }
  }
  
  return []; // No path found
}

// Game Logic
function movePacmanAI() {
  if (!aiEnabled) return;
  
  // Calculate path to ghost
  currentPath = aStar({x: pacman.x, y: pacman.y}, {x: ghost.x, y: ghost.y});
  
  if (currentPath.length > 1) {
    const next = currentPath[1];
    pacman.x = next.x;
    pacman.y = next.y;
    
    // Eat dots
    if (map[pacman.y][pacman.x] === '.') {
      map[pacman.y][pacman.x] = ' ';
      score += 10;
      createParticles(pacman.x * TILE + TILE/2, pacman.y * TILE + TILE/2, "#ffb8ae");
    } else if (map[pacman.y][pacman.x] === 'O') {
      map[pacman.y][pacman.x] = ' ';
      score += 50;
      powerTimer = 50; // ~6 seconds at 120ms
      createParticles(pacman.x * TILE + TILE/2, pacman.y * TILE + TILE/2, "#fff");
    }
  }
}

function createParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 1.0,
      color
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.05;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// Ghost Squad: Red -> Pink -> Cyan -> Orange -> Green
const GHOST_SQUAD = [
  { color: '#ff0000', speed: 200, name: 'Red' },
  { color: '#ffb8ff', speed: 180, name: 'Pink' },
  { color: '#00ffff', speed: 160, name: 'Cyan' },
  { color: '#ffb852', speed: 140, name: 'Orange' },
  { color: '#00ff00', speed: 120, name: 'Green' }
];
let currentGhostIndex = 0;
let ghost = { x: 19, y: 9, ...GHOST_SQUAD[0] };

// ... (A* functions remain same) ...

function moveGhostEvasive() {
  if (powerTimer > 0) powerTimer--;
  
  // Ghost tries to escape from Pacman
  const dirs = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}];
  let bestDir = null;
  let maxDist = -1;
  
  // Create deep copy of ghost position for simulation
  let currentDist = heuristic(ghost, pacman);
  
  for (const d of dirs) {
    const nx = ghost.x + d.x;
    const ny = ghost.y + d.y;
    
    // Check boundaries and walls
    if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS && map[ny][nx] !== '#') {
      // Calculate distance from Pacman if we move to (nx, ny)
      const dist = heuristic({x: nx, y: ny}, pacman);
      
      // Prefer moves that increase distance
      if (dist > maxDist) {
        maxDist = dist;
        bestDir = d;
      }
    }
  }
  
  // Move 
  if (bestDir && maxDist >= currentDist) {
     // If we found a move that keeps or increases distance, take it
     ghost.x += bestDir.x;
     ghost.y += bestDir.y;
  } else if (bestDir) {
     // If trapped, take best available option (even if distance decreases slightly)
     ghost.x += bestDir.x;
     ghost.y += bestDir.y;
  }
}

function spawnNextGhost() {
  currentGhostIndex = (currentGhostIndex + 1) % GHOST_SQUAD.length;
  const nextGhost = GHOST_SQUAD[currentGhostIndex];
  
  // Respawn at random processing
  let attempts = 0;
  while (attempts < 100) {
    const rx = Math.floor(Math.random() * COLS);
    const ry = Math.floor(Math.random() * ROWS);
    if (map[ry][rx] !== '#' && heuristic({x: rx, y: ry}, pacman) > 8) {
      ghost = { x: rx, y: ry, ...nextGhost };
      
      // Flash effect or notification could go here
      const infoEl = document.querySelector('.info');
      infoEl.innerHTML = `⚠️ <b>${nextGhost.name} Ghost</b> spawned! Speed: ${nextGhost.speed}ms`;
      break;
    }
    attempts++;
  }
}

function checkCollision() {
  if (pacman.x === ghost.x && pacman.y === ghost.y) {
    if (powerTimer > 0) {
      // Pacman eats ghost
      catches++;
      score += 200;
      createParticles(ghost.x * TILE + TILE/2, ghost.y * TILE + TILE/2, "#00ffff");
      spawnNextGhost();
    } else {
      // Ghost eats Pacman (Reset for now)
      createParticles(pacman.x * TILE + TILE/2, pacman.y * TILE + TILE/2, "#ffff00");
      resetGame();
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw map
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const cell = map[y][x];
      if (cell === '#') {
        ctx.fillStyle = "#1919a6";
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        ctx.fillStyle = "#000";
        ctx.fillRect(x * TILE + 3, y * TILE + 3, TILE - 6, TILE - 6);
      } else if (cell === '.') {
        ctx.fillStyle = "#ffb8ae";
        ctx.beginPath();
        ctx.arc(x * TILE + TILE/2, y * TILE + TILE/2, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (cell === 'O') {
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        const pulse = Math.sin(Date.now() / 150) * 2;
        ctx.arc(x * TILE + TILE/2, y * TILE + TILE/2, 6 + pulse, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  
  // Draw particles
  ctx.globalAlpha = 1.0;
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1.0;
  
  // Debug: Draw AI path
  if (debugMode && currentPath.length > 0) {
    ctx.strokeStyle = "rgba(0, 255, 0, 0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(currentPath[0].x * TILE + TILE/2, currentPath[0].y * TILE + TILE/2);
    for (let i = 1; i < currentPath.length; i++) {
      ctx.lineTo(currentPath[i].x * TILE + TILE/2, currentPath[i].y * TILE + TILE/2);
    }
    ctx.stroke();
    
    // Draw path nodes
    ctx.fillStyle = "rgba(0, 255, 0, 0.3)";
    for (const node of currentPath) {
      ctx.beginPath();
      ctx.arc(node.x * TILE + TILE/2, node.y * TILE + TILE/2, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Draw Ghost (Dynamic Color)
  ctx.fillStyle = powerTimer > 0 ? (powerTimer < 20 && Math.floor(Date.now()/200) % 2 ? "#fff" : "#2121de") : (ghost.color || "#ff0000");
  ctx.beginPath();
  const gx = ghost.x * TILE + TILE/2;
  const gy = ghost.y * TILE + TILE/2;
  ctx.arc(gx, gy - 2, 8, Math.PI, 0);
  ctx.lineTo(gx + 8, gy + 6);
  ctx.lineTo(gx + 4, gy + 2);
  ctx.lineTo(gx, gy + 6);
  ctx.lineTo(gx - 4, gy + 2);
  ctx.lineTo(gx - 8, gy + 6);
  ctx.fill();
  // Ghost eyes
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(gx - 3, gy - 4, 3, 0, Math.PI * 2);
  ctx.arc(gx + 3, gy - 4, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#00f";
  ctx.beginPath();
  ctx.arc(gx - 2, gy - 4, 1.5, 0, Math.PI * 2);
  ctx.arc(gx + 4, gy - 4, 1.5, 0, Math.PI * 2);
  ctx.fill();
  
  // Draw Pac-Man (Yellow Hunter)
  ctx.fillStyle = "#ffff00";
  ctx.beginPath();
  const px = pacman.x * TILE + TILE/2;
  const py = pacman.y * TILE + TILE/2;
  const mouthAngle = Math.abs(Math.sin(Date.now() / 100)) * 0.3;
  
  // Calculate direction to ghost for mouth orientation
  let angle = 0;
  if (currentPath.length > 1) {
    const next = currentPath[1];
    const dx = next.x - pacman.x;
    const dy = next.y - pacman.y;
    angle = Math.atan2(dy, dx);
  }
  
  ctx.arc(px, py, 9, angle + mouthAngle, angle + Math.PI * 2 - mouthAngle);
  ctx.lineTo(px, py);
  ctx.fill();
  
  // Update stats
  document.getElementById("score").textContent = score;
  document.getElementById("catches").textContent = catches;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("pacman_highscore", highScore);
  }
  document.getElementById("highScore").textContent = highScore;
}

// Game Loop
let lastMoveTime = 0;
let lastGhostTime = 0;
const PACMAN_SPEED = 120; // ms per move
const GHOST_SPEED = 200;  // ms per move (slower = easier to catch)

function gameLoop(timestamp) {
  // Move Pacman
  if (timestamp - lastMoveTime > PACMAN_SPEED) {
    movePacmanAI();
    checkCollision();
    lastMoveTime = timestamp;
  }
  
  // Move Ghost (slower)
  if (timestamp - lastGhostTime > GHOST_SPEED) {
    moveGhostEvasive();
    checkCollision();
    lastGhostTime = timestamp;
  }
  
  updateParticles();
  draw();
  requestAnimationFrame(gameLoop);
}

// Timer
setInterval(() => {
  gameTime++;
  document.getElementById("time").textContent = gameTime;
}, 1000);

// Controls
function toggleAI() {
  aiEnabled = !aiEnabled;
  document.getElementById("aiStatus").textContent = aiEnabled ? "ON" : "OFF";
}

function toggleDebug() {
  debugMode = !debugMode;
  document.getElementById("debugStatus").textContent = debugMode ? "ON" : "OFF";
}

function resetGame() {
  pacman = { x: 1, y: 1, dx: 0, dy: 0 };
  currentGhostIndex = 0;
  ghost = { x: 19, y: 9, ...GHOST_SQUAD[0] };
  score = 0;
  catches = 0;
  gameTime = 0;
  map = mapTemplate.map(row => row.split(''));
  currentPath = [];
  document.querySelector('.info').innerHTML = `🧠 Pac-Man uses <b>A* pathfinding</b> to hunt the red ghost in real-time.`;
}

// Manual controls
function manualMove(dx, dy) {
  if (aiEnabled) toggleAI(); // Auto-disable AI when player takes control
  
  let nx = pacman.x + dx;
  let ny = pacman.y + dy;
  
  if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS && map[ny][nx] !== '#') {
    pacman.x = nx;
    pacman.y = ny;
    if (map[ny][nx] === '.') {
      map[ny][nx] = ' ';
      score += 10;
    }
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") manualMove(0, -1);
  else if (e.key === "ArrowDown") manualMove(0, 1);
  else if (e.key === "ArrowLeft") manualMove(-1, 0);
  else if (e.key === "ArrowRight") manualMove(1, 0);
});

// Start
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
