name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */12 * * *' # Run every 12 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Stats Updater
        run: python scripts/update_stats.py
        
      - name: Run AI Dashboard Generator
        run: python scripts/update_dashboard.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/github_stats.svg assets/dashboard.svg || echo "Assets missing"
          git commit -m "Updated GitHub stats and AI Dashboard" || echo "No changes to commit"
          git pull --rebase origin main
          git push
