name: Security Audit

on:
  workflow_dispatch:

  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron:
  workflow_dispatch:
 '0 0 * * 1' # Weekly scan

jobs:
  security_scan:
    name: Security Scan (Trivy)
    runs-on:
  workflow_dispatch:
 ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

