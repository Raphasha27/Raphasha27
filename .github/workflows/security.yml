name: Security Scan (Private)

on:
  # Manual trigger only - no scheduled scans
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/security.yml"

jobs:
  security-check:
    name: Private Security Check
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      # Removed security-events write permission
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy FS Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          format: "table"  # Table format stays in logs only
          skip-dirs: ".git,.github"
          exit-code: "0"
          
      - name: Security check completed
        run: |
          echo "✅ Security check completed for profile repository"
          echo "🔒 Results are private and only visible in workflow logs"