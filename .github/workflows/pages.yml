name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - dev
      - experimental/v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (only if package.json exists)
        id: node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build (only if package.json exists)
        if: steps.node.outcome == 'success'
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run build --if-present

      - name: Include docs in deploy output
        run: |
          if [ -d docs ]; then
            for p in dist out build public; do
              if [ -d "$p" ]; then cp -r docs "$p"/docs 2>/dev/null || true; fi
            done
          fi

      - name: Determine deploy path
        id: deploy_path
        run: |
          for p in dist build out public; do
            if [ -d "$p" ] && [ "$(ls -A "$p" | head -c1)" ]; then
              echo "deploy_path=$p" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "deploy_path=." >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.deploy_path.outputs.deploy_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
