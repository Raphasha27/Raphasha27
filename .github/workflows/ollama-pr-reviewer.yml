name: 100% Free Local AI PR Reviewer (Ollama)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install and Start Ollama
        run: |
          # Install Ollama
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Start Ollama server in the background
          ollama serve &
          
          # Wait for the server to start
          sleep 5
          
          # Pull a highly capable, fast local model for code review
          ollama pull qwen2.5:3b

      - name: Local AI PR Review
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ollama doesn't need a real API key
          OPENAI_API_KEY: "dummy"
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          
          # Point the reviewer to the local Ollama instance (OpenAI compatible endpoint)
          openai_base_url: "http://localhost:11434/v1"
          
          # Use the local model we just downloaded
          openai_light_model: "qwen2.5:3b"
          openai_heavy_model: "qwen2.5:3b"
          
          system_message: |
            You are an expert software architect and security reviewer reviewing a Pull Request.
            Your role is to find what breaks in production, NOT what a linter would catch.
            Do NOT comment on syntax, typos, formatting, or style preferences. These are completely useless.
            
            Focus heavily on:
            - Business logic correctness
            - SQL injection vectors
            - Unhandled edge cases
            - N+1 queries
            - Performance issues
            - Architecture and design
            
            CRITICAL RULES:
            - Flag anything that touches authentication (auth), payments, or data deletions.
            - Set severity thresholds: CRITICAL issues must be clearly marked to block the merge. WARNINGS are only informational.
            - Post inline comments directly on the problematic lines so the developer can review the feedback before merging.
