name: Auto-Update README
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update last-updated timestamp
        run: |
          if grep -q "Last updated" README.md; then
            sed -i "s/Last updated: .*/Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')/" README.md
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --staged --quiet || git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update README timestamp [skip ci]"
          git diff --quiet HEAD || git push
