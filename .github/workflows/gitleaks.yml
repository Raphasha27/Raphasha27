name: Secret Leak Detection
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: repo
          scan-ref: .
          format: sarif
          output: trivy-secrets.sarif
          severity: CRITICAL,HIGH
          scanners: secret
      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-secrets.sarif
          category: secrets
