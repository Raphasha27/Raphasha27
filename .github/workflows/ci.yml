name: Standard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check HTML files
        run: |
          echo "Validating HTML files..."
          for f in index.html pacman_game.html snake_ai.html; do
            [ -f "$f" ] && echo "  ✓ $f exists" || echo "  - $f not present"
          done

      - name: Validate YAML workflows
        run: |
          echo "Checking workflow YAML syntax..."
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" \
              && echo "  ✓ $f" \
              || { echo "  ✗ $f — invalid YAML"; exit 1; }
          done
