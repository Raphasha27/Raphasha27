name: Standard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML files
        run: |
          echo "Validating HTML files..."
          for f in index.html pacman_game.html snake_ai.html; do
            if [ -f "$f" ]; then
              echo "  ✓ $f exists"
            fi
          done

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          echo "Checking JSON files..."
          for f in .github/dependabot.yml .editorconfig; do
            if [ -f "$f" ]; then
              echo "  ✓ $f exists"
            fi
          done
