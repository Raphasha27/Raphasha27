name: 🏛️ Kirov CI Heartbeat

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  triage: 
    name: Repository Health Triage
    runs-on: contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: -
    name: Install dependencies
        run: pip install requests

      - name: Run Heartbeat Triage
        env: 
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/triage_heartbeat.py
  security_scan: 
    name: Security Scan (Trivy)
    runs-on: -
    uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'