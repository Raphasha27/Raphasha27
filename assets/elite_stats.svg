<svg width="1000" height="450" viewBox="0 0 1000 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="450" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top Programming Languages Title -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#f0f6fc">TOP PROGRAMMING LANGUAGES</text>

  <!-- Donut Chart -->
  <g transform="translate(250, 240)">
    <!-- Arc: Python -->
    <path d="M 0,-120 A 120,120 0 0,1 114.1,-37.1 L 0,0 Z" fill="#3b82f6"/>
    <!-- Arc: JS -->
    <path d="M 114.1,-37.1 A 120,120 0 0,1 37.1,114.1 L 0,0 Z" fill="#fbbf24"/>
    <!-- Arc: Java -->
    <path d="M 37.1,114.1 A 120,120 0 0,1 -84.8,84.9 L 0,0 Z" fill="#10b981"/>
    <!-- Arc: C++ -->
    <path d="M -84.8,84.9 A 120,120 0 0,1 -114.1,-37.1 L 0,0 Z" fill="#6366f1"/>
    <!-- Arc: Others -->
    <path d="M -114.1,-37.1 A 120,120 0 0,1 0,-120 L 0,0 Z" fill="#94a3b8"/>
    
    <!-- White Hole -->
    <circle cx="0" cy="0" r="60" fill="#0d1117"/>
    
    <!-- Icon Overlays (simplified) -->
    <text x="60" y="-60" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Python</text>
    <text x="80" y="40" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">JS</text>
    <text x="-40" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Java</text>
    <text x="-80" y="-10" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">C++</text>
  </g>

  <!-- Stats Card -->
  <g transform="translate(550, 80)">
    <rect width="400" height="320" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <!-- Card Header -->
    <path d="M 0,16 Q 0,0 16,0 L 384,0 Q 400,0 400,16 L 400,80 L 0,80 Z" fill="#2d3e50"/>
    <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="white">GITHUB STATS SUMMARY</text>
    
    <!-- Commits -->
    <g transform="translate(40, 110)">
      <rect width="320" height="60" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="20" y="38" font-family="Arial" font-size="16" font-weight="bold" fill="#64748b">TOTAL COMMITS:</text>
      <text x="170" y="40" font-family="Arial" font-size="28" font-weight="900" fill="#10b981">2,437</text>
    </g>

    <!-- Stars -->
    <g transform="translate(40, 185)">
      <rect width="320" height="60" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="20" y="38" font-family="Arial" font-size="16" font-weight="bold" fill="#64748b">STARS EARNED:</text>
      <text x="170" y="40" font-family="Arial" font-size="28" font-weight="900" fill="#f59e0b">567</text>
    </g>

    <!-- PRs -->
    <g transform="translate(40, 260)">
      <rect width="320" height="60" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="20" y="38" font-family="Arial" font-size="16" font-weight="bold" fill="#64748b">PRs MERGED:</text>
      <text x="170" y="40" font-family="Arial" font-size="28" font-weight="900" fill="#8b5cf6">142</text>
    </g>
  </g>
</svg>
