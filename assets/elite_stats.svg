<svg fill="none" viewBox="0 0 1000 450" width="1000" height="450" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap');
        
        .container {
          background: #f8fafc;
          font-family: 'Inter', sans-serif;
          width: 998px;
          height: 448px;
          display: flex;
          align-items: center;
          padding: 40px;
          box-sizing: border-box;
          border-radius: 12px;
          border: 1px solid #e2e8f0;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .left-section {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .title {
          font-size: 24px;
          font-weight: 800;
          color: #1e293b;
          margin-bottom: 30px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .donut-container {
          position: relative;
          width: 300px;
          height: 300px;
        }

        .donut {
          width: 100%;
          height: 100%;
          border-radius: 50%;
          background: conic-gradient(
            #3b82f6 0% 45%,
            #fbbf24 45% 72%,
            #10b981 72% 88%,
            #6366f1 88% 95%,
            #94a3b8 95% 100%
          );
          mask: radial-gradient(circle, transparent 40%, black 41%);
          -webkit-mask: radial-gradient(circle, transparent 40%, black 41%);
        }

        .lang-icon {
          position: absolute;
          width: 35px;
          height: 35px;
          background: white;
          border-radius: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .right-section {
          flex: 1;
          display: flex;
          justify-content: center;
        }

        .stats-card {
          background: white;
          width: 420px;
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
          border: 1px solid #e2e8f0;
        }

        .card-header {
          background: #2d3e50;
          padding: 20px 30px;
          display: flex;
          align-items: center;
          gap: 15px;
        }

        .header-title {
          color: white;
          font-size: 20px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 1px;
        }

        .card-content {
          padding: 30px;
          display: flex;
          flex-direction: column;
          gap: 25px;
        }

        .stat-row {
          display: flex;
          align-items: center;
          gap: 20px;
        }

        .icon-bg {
          width: 60px;
          height: 60px;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .stat-info {
          display: flex;
          flex-direction: column;
        }

        .stat-label {
          font-size: 16px;
          color: #64748b;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .stat-value {
          font-size: 32px;
          color: #1e293b;
          font-weight: 800;
          line-height: 1;
        }
      </style>
      <div class="container">
        <div class="left-section">
          <div class="title">Top Programming Languages</div>
          <div class="donut-container">
            <div class="donut"></div>
            <!-- Python -->
            <div class="lang-icon" style="top: 15%; right: 10%;">
              <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/python/python-original.svg" width="24"/>
            </div>
            <!-- JS -->
            <div class="lang-icon" style="bottom: 15%; right: 5%;">
              <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/javascript/javascript-original.svg" width="24"/>
            </div>
            <!-- Java -->
            <div class="lang-icon" style="bottom: 10%; left: 25%;">
              <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/java/java-original.svg" width="24"/>
            </div>
            <!-- C++ -->
            <div class="lang-icon" style="top: 35%; left: 5%;">
              <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/cplusplus/cplusplus-original.svg" width="24"/>
            </div>
          </div>
        </div>
        <div class="right-section">
          <div class="stats-card">
            <div class="card-header">
              <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/github/github-original.svg" width="40" style="filter: invert(1);"/>
              <div class="header-title">GitHub Stats Summary</div>
            </div>
            <div class="card-content">
              <div class="stat-row">
                <div class="icon-bg" style="background: #ecfdf5;">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                  </svg>
                </div>
                <div class="stat-info">
                  <div class="stat-label">Total Commits</div>
                  <div class="stat-value">2.4k+</div>
                </div>
              </div>
              <div class="stat-row">
                <div class="icon-bg" style="background: #fffbeb;">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                  </svg>
                </div>
                <div class="stat-info">
                  <div class="stat-label">Stars Earned</div>
                  <div class="stat-value">567</div>
                </div>
              </div>
              <div class="stat-row">
                <div class="icon-bg" style="background: #f5f3ff;">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2.5">
                    <path d="M18 13V9a2 2 0 00-2-2H9.5"/>
                    <path d="M14.5 3L11 6.5l3.5 3.5"/>
                    <circle cx="6" cy="6" r="3"/>
                    <circle cx="18" cy="18" r="3"/>
                    <path d="M6 9v7a2 2 0 002 2h7"/>
                  </svg>
                </div>
                <div class="stat-info">
                  <div class="stat-label">PRs Merged</div>
                  <div class="stat-value">142</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
