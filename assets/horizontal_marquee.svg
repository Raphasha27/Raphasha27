<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes scroll {
      0% { transform: translateX(100%); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(-100%); opacity: 0; }
    }
    .track {
      animation: scroll 20s linear infinite;
    }
  </style>

  <defs>
    <linearGradient id="fade-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="black" stop-opacity="0" />
      <stop offset="20%" stop-color="black" stop-opacity="1" />
      <stop offset="80%" stop-color="black" stop-opacity="1" />
      <stop offset="100%" stop-color="black" stop-opacity="0" />
    </linearGradient>
    <mask id="fade-mask">
      <rect width="800" height="100" fill="url(#fade-grad)" />
    </mask>
  </defs>

  <g mask="url(#fade-mask)">
    <g class="track">
      <image href="https://skillicons.dev/icons?i=py,js,ts,react,nextjs,docker,aws,postgres,nodejs,rust,cpp,java,html,css,php,go&amp;perline=16" x="0" y="20" height="60" />
    </g>
  </g>
</svg>
