<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
      <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
          <style>
            .container {
              font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
              background: #0d1117;
              border: 1px solid #30363d;
              border-radius: 10px;
              width: 100%;
              height: 200px;
              display: flex;
              justify-content: space-between;
              align-items: center;
              color: #c9d1d9;
              overflow: hidden;
              position: relative;
            }
            .glass {
                background: rgba(22, 27, 34, 0.8);
                backdrop-filter: blur(10px);
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                z-index: 0;
            }
            .content {
                z-index: 1;
                display: flex;
                width: 100%;
                padding: 20px;
                justify-content: space-between;
            }
            .left-panel {
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .right-panel {
                text-align: right;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            h1 { margin: 0; font-size: 48px; font-weight: 700; color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
            h2 { margin: 0; font-size: 20px; color: #8b949e; letter-spacing: 1px; }
            .weather-box { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
            .temp { font-size: 36px; font-weight: bold; color: #e2e8f0; }
            .condition { font-size: 16px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
            .prediction { 
                margin-top: 15px; 
                font-family: 'Courier New', monospace; 
                font-size: 12px; 
                color: #22c55e; 
                background: rgba(0,0,0,0.3); 
                padding: 8px; 
                border-left: 3px solid #22c55e;
            }
            .location { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 14px; color: #8b949e; margin-bottom: 5px; }
            .badge { 
                background: #1f6feb; 
                color: white; 
                padding: 2px 8px; 
                border-radius: 12px; 
                font-size: 10px; 
                font-weight: bold;
            }
          </style>
          <div class="container">
            <div class="glass"></div>
            <div class="content">
                <div class="left-panel">
                    <h2>SOUTH AFRICA (SAST)</h2>
                    <h1>10:40</h1>
                    <div class="weather-box">
                        <div class="temp">25.3°C</div>
                        <div>
                            <div class="condition">Partly Cloudy</div>
                            <div style="font-size: 12px; color: #8b949e;">H: 29.5° L: 16.9°</div>
                        </div>
                    </div>
                </div>
                <div class="right-panel">
                    <div class="location">
                        <!-- Apple Logo SVG -->
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#c9d1d9" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                        </svg>
                        <span>JOHANNESBURG</span>
                        <span class="badge">LIVE</span>
                    </div>
                    <div style="font-size: 14px; color: #c9d1d9; margin-bottom: 20px;">Sunday, 08 Feb 2026</div>
                    <div class="prediction">
                        PREDICTION: Systems nominal. Ideal extensive coding conditions.
                        <br/>
                        SYSTEM STATUS: OPTIMAL
                    </div>
                </div>
            </div>
          </div>
        </div>
      </foreignObject>
    </svg>
    