<svg width="1000" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    INFINITE HORIZONTAL MARQUEE
    DIRECTION: Right to Left
    SPEED: 60s (Slow/Prestige)
    LOOP: Double-track 50% translation
  -->
  <defs>
    <style>
      .cert-track {
        animation: scroll-left 60s linear infinite;
      }
      @keyframes scroll-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-2420px); } /* Exactly 11 cards * 220px */
      }
      .cert-pill {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1;
        transition: all 0.3s ease;
      }
      .cert-pill:hover {
        stroke: #38bdf8;
        fill: #1c2128;
      }
      .cert-text {
        fill: #c9d1d9;
        font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
      .cert-subtext {
        fill: #8b949e;
        font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        font-size: 10px;
      }
      .icon-bg {
        fill: #0d1117;
        stroke: #38bdf8;
        stroke-width: 1;
      }
    </style>
    
    <!-- Edge Fading Gradients -->
    <linearGradient id="edge-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="10%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="90%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>

    <mask id="track-mask">
      <rect width="1000" height="120" fill="white" />
    </mask>
  </defs>
  
  <rect width="1000" height="120" fill="#0d1117" rx="12"/>
  
  <g mask="url(#track-mask)">
    <g class="cert-track">
      <!-- SET 1 (11 Badges, spaced at 220px horizontally) -->
      <!-- Card 1 -->
      <g transform="translate(10, 25)">
        <rect class="cert-pill" width="200" height="70" rx="35"/>
        <circle class="icon-bg" cx="35" cy="35" r="22"/>
        <text x="35" y="41" text-anchor="middle" font-size="18">🎓</text>
        <text x="70" y="38" class="cert-text">BSc Information Tech</text>
        <text x="70" y="52" class="cert-subtext">Richfield Graduate Inst.</text>
      </g>
      <!-- Card 2 -->
