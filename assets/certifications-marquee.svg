<svg width="1000" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cert-track {
        animation: scroll 40s linear infinite;
        display: flex;
      }
      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .cert-pill {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1.5;
      }
      .cert-pill:hover {
        stroke: #38bdf8;
        fill: #1c2128;
      }
      .cert-text {
        fill: #c9d1d9;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
      }
      .cert-subtext {
        fill: #8b949e;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 10px;
      }
      .icon-circle {
        fill: #0d1117;
        stroke: #38bdf8;
        stroke-width: 1;
      }
    </style>
    
    <linearGradient id="fadeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="5%" style="stop-color:#0d1117;stop-opacity:0" />
      <stop offset="95%" style="stop-color:#0d1117;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>

    <mask id="fadeMask">
      <rect width="1000" height="120" fill="white"/>
    </mask>
  </defs>
  
  <rect width="1000" height="120" fill="#0d1117" rx="12"/>
  
  <g mask="url(#fadeMask)">
    <g class="cert-track">
      <!-- SET 1 (11 Badges, 220px spacing) -->
      <!-- BSc IT -->
      <g transform="translate(10, 25)">
