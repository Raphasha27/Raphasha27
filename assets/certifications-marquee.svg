        <text x="35" y="40" text-anchor="middle" font-size="18">🎓</text>
        <text x="70" y="38" class="cert-text">BSc Information Tech</text>
        <text x="70" y="52" class="cert-subtext">Richfield Graduate Inst.</text>
      </g>
      
      <!-- Google Data -->
