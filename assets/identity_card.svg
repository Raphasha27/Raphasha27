<svg fill="none" viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .card {
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 12px;
          padding: 24px;
          color: #c9d1d9;
          font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
          height: 450px;
          display: flex;
          flex-direction: column;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          transition: border-color 0.3s ease;
        }
        .card:hover {
          border-color: #38bdf8;
        }
        .window-header {
          display: flex;
          gap: 8px;
          margin-bottom: 20px;
          border-bottom: 1px solid #30363d;
          padding-bottom: 12px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; opacity: 0.8; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        
        .info-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
          margin-bottom: 20px;
        }
        
        .info-section {
          background: rgba(48, 54, 61, 0.2);
          border: 1px solid #30363d;
          border-radius: 8px;
          padding: 15px;
        }
        
        .label {
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 1px;
          color: #8b949e;
          margin-bottom: 8px;
          display: block;
        }
        
        .value {
          font-size: 14px;
          font-weight: 600;
          color: #38bdf8;
          display: block;
        }
        
        .highlight { color: #f0f6fc; }
        
        .bio-section {
          flex-grow: 1;
          margin-bottom: 20px;
          padding: 0 5px;
        }
        
        .bio-text {
          font-size: 14px;
          line-height: 1.6;
          color: #8b949e;
          text-align: justify;
        }
        
        .footer-status {
          display: flex;
          justify-content: space-between;
          padding: 12px;
          background: rgba(56, 189, 248, 0.05);
          border: 1px solid rgba(56, 189, 248, 0.1);
          border-radius: 8px;
        }
        
        .status-pill {
          font-size: 11px;
          font-weight: 700;
          padding: 4px 10px;
          border-radius: 4px;
          letter-spacing: 0.5px;
        }
        .collab { color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
        .global { color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .elite { color: #ec4899; border: 1px solid rgba(236, 72, 153, 0.3); }

      </style>
      <div class="card">
        <div class="window-header">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        
        <div class="info-grid">
          <div class="info-section">
            <span class="label">Primary Executive Role</span>
            <span class="value">◈ Co-founder @ <span class="highlight">Kivoc Dynamics Technology</span></span>
          </div>
          <div class="info-section">
            <span class="label">Academic Foundation</span>
            <span class="value">🎓 Bachelor of IT <span class="highlight">(Richfield)</span> • Distinction in Mobile Dev</span>
          </div>
        </div>
        
        <div class="bio-section">
          <span class="label">Executive Summary</span>
          <p class="bio-text">
            Elite Software Developer and AI Engineer specializing in architecting high-performance systems and intelligent automation. Expertise spans full-stack web development with modern frameworks (React, Vue.js, Next.js), backend engineering (Node.js, .NET, FastAPI), and AI/ML solutions for predictive analytics and autonomous systems. Proven track record building scalable enterprise platforms, real-time reservation engines (C++, C#), and cutting-edge web applications with premium UX. Passionate about sovereign AI, data privacy, and creating systems that merge innovation, speed, and precision to solve complex challenges at scale.
          </p>
        </div>
        
        <div class="footer-status">
          <div class="status-pill collab">⌘ ELITE COLLABORATIONS</div>
          <div class="status-pill global">◈ GLOBAL-SCALE SYSTEMS</div>
          <div class="status-pill elite">⚡ INNOVATION &amp; PRECISION</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
