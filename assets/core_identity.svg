<svg width="450" height="320" viewBox="0 0 450 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .header { fill: #161b22; }
      .dot { stroke-width: 0; }
      .red { fill: #ff5f56; }
      .yellow { fill: #ffbd2e; }
      .green { fill: #27c93f; }
      
      .code-container { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
      .key { fill: #79c0ff; }
      .string { fill: #a5d6ff; }
      .value { fill: #ffa657; }
      .bracket { fill: #d1d5da; }
      .comment { fill: #8b949e; font-style: italic; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect class="bg" width="450" height="320" rx="10"/>
  <rect class="header" width="450" height="35" rx="10 10 0 0" />
  
  <!-- Mac Buttons -->
  <circle class="dot red" cx="25" cy="18" r="6" />
  <circle class="dot yellow" cx="45" cy="18" r="6" />
  <circle class="dot green" cx="65" cy="18" r="6" />

  <!-- Code Snippet: Tech Stack & Git Config -->
  <g class="code-container" transform="translate(30, 65)">
    <text y="0" class="bracket">{</text>
    
    <g transform="translate(20, 20)">
      <text y="0"><tspan class="key">"git_config"</tspan><tspan class="bracket">: {</tspan></text>
      <text y="20" x="20"><tspan class="key">"user"</tspan><tspan class="bracket">: </tspan><tspan class="string">"Raphasha27"</tspan><tspan class="bracket">,</tspan></text>
      <text y="40" x="20"><tspan class="key">"engine"</tspan><tspan class="bracket">: </tspan><tspan class="string">"GitHub Actions"</tspan><tspan class="bracket">,</tspan></text>
      <text y="60" x="20"><tspan class="key">"branch"</tspan><tspan class="bracket">: </tspan><tspan class="string">"main/master"</tspan></text>
      <text y="80"><tspan class="bracket">},</tspan></text>
      
      <text y="105"><tspan class="key">"it_infrastructure"</tspan><tspan class="bracket">: {</tspan></text>
      <text y="125" x="20"><tspan class="key">"os"</tspan><tspan class="bracket">: </tspan><tspan class="string">"Windows | WSL2 (Linux)"</tspan><tspan class="bracket">,</tspan></text>
      <text y="145" x="20"><tspan class="key">"IDE"</tspan><tspan class="bracket">: </tspan><tspan class="string">"VS Code | Visual Studio"</tspan><tspan class="bracket">,</tspan></text>
      <text y="165" x="20"><tspan class="key">"cloud"</tspan><tspan class="bracket">: </tspan><tspan class="string">"Vercel | Azure | Render"</tspan></text>
      <text y="185"><tspan class="bracket">},</tspan></text>
      
      <text y="210"><tspan class="key">"core_stack"</tspan><tspan class="bracket">: [</tspan><tspan class="string">"AI"</tspan><tspan class="bracket">, </tspan><tspan class="string">"React"</tspan><tspan class="bracket">, </tspan><tspan class="string">"Python"</tspan><tspan class="bracket">, </tspan><tspan class="string">"C++"</tspan><tspan class="bracket">],</tspan></text>
      <text y="235"><tspan class="key">"system_status"</tspan><tspan class="bracket">: </tspan><tspan class="value">"PRODUCTION_READY"</tspan></text>
    </g>
    
    <text y="275" class="bracket">}</text>
  </g>
  
  <text x="30" y="305" class="comment" font-family="monospace" font-size="10">// Initializing IT Environment: SAST-NODE-01</text>
</svg>
