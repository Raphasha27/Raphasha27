<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .title { fill: #8b949e; font-family: 'Segoe UI', sans-serif; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
      .level-label { fill: #c9d1d9; font-family: 'Segoe UI', sans-serif; font-size: 10px; }
      .level-val { fill: #e2e8f0; font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; }
      .count { fill: #e2e8f0; font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; }
      .glyph-circle { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    </style>
    
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect class="bg" width="400" height="120" rx="10"/>
  
  <!-- Playstation Header -->
  <text x="15" y="25" class="title">PLAYSTATION™ NETWORK ACHIEVEMENTS</text>
  
  <!-- Level Indicator -->
  <g transform="translate(15, 45)">
    <circle cx="20" cy="20" r="25" fill="#161b22" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="120 40"/>
    <text x="20" y="15" text-anchor="middle" class="level-label">LVL</text>
    <text x="20" y="32" text-anchor="middle" class="level-val">403</text>
  </g>

  <!-- Trophies Row -->
  <g transform="translate(85, 55)">
    <!-- Platinum -->
    <g transform="translate(0, 0)">
        <circle class="glyph-circle" cx="20" cy="0" r="18"/>
        <path d="M20 -10 L25 -2 L33 -2 L27 4 L29 12 L20 7 L11 12 L13 4 L7 -2 L15 -2 Z" fill="url(#platGrad)"/>
        <text x="20" y="35" text-anchor="middle" class="count">69</text>
    </g>
    <!-- Gold -->
    <g transform="translate(70, 0)">
        <circle class="glyph-circle" cx="20" cy="0" r="18"/>
        <path d="M20 -8 L22 -2 L28 -2 L23 2 L25 8 L20 4 L15 8 L17 2 L12 -2 L18 -2 Z" fill="url(#goldGrad)"/>
        <text x="20" y="35" text-anchor="middle" class="count">420</text>
    </g>
    <!-- Silver -->
    <g transform="translate(140, 0)">
        <circle class="glyph-circle" cx="20" cy="0" r="18"/>
        <path d="M20 -8 L22 -2 L28 -2 L23 2 L25 8 L20 4 L15 8 L17 2 L12 -2 L18 -2 Z" fill="url(#silverGrad)"/>
        <text x="20" y="35" text-anchor="middle" class="count">1201</text>
    </g>
    <!-- Bronze -->
    <g transform="translate(210, 0)">
        <circle class="glyph-circle" cx="20" cy="0" r="18"/>
        <path d="M20 -8 L22 -2 L28 -2 L23 2 L25 8 L20 4 L15 8 L17 2 L12 -2 L18 -2 Z" fill="url(#bronzeGrad)"/>
        <text x="20" y="35" text-anchor="middle" class="count">4042</text>
    </g>
  </g>
</svg>
