<svg fill="none" viewBox="0 0 1000 1000" width="1000" height="1000" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0b1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .title { font-family: system-ui, sans-serif; font-weight: 900; font-size: 56px; text-transform: uppercase; letter-spacing: -1px; }
    .section-label { fill: #8b949e; font-family: system-ui, sans-serif; font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
    .item-bg { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); stroke-width: 1; }
    .item-title { fill: #f0f6fc; font-family: system-ui, sans-serif; font-weight: 600; font-size: 18px; }
    .icon-bg { rx: 10; }
    .icon-letter { font-family: system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
  </style>

  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8b949e" />
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" class="bg" />
  <text x="500" y="100" text-anchor="middle" fill="url(#tg)" class="title">THE 2026</text>
  <text x="500" y="160" text-anchor="middle" fill="url(#tg)" class="title">DEVELOPER'S ARSENAL</text>

  <!-- Left Column: Language Heavyweights -->
  <rect x="50" y="220" width="440" height="730" class="card" stroke="#22d3ee" stroke-width="2" rx="20"/>
  <text x="75" y="265" class="section-label">Language Heavyweights</text>

  <!-- C# -->
  <g transform="translate(75, 290)">
    <rect width="390" height="74" class="item-bg" rx="14"/>
    <rect width="50" height="50" x="15" y="12" class="icon-bg" fill="#68217A"/>
    <text x="40" y="37" class="icon-letter">C#</text>
    <text x="80" y="45" class="item-title">C#: Enterprise &amp; .NET Mastery</text>
  </g>

  <!-- C++ -->
  <g transform="translate(75, 385)">
    <rect width="390" height="74" class="item-bg" rx="14"/>
    <rect width="50" height="50" x="15" y="12" class="icon-bg" fill="#00599C"/>
    <text x="40" y="37" class="icon-letter">C++</text>
    <text x="80" y="45" class="item-title">C++: High-Performance Systems</text>
  </g>

  <!-- Python -->
  <g transform="translate(75, 480)">
    <rect width="390" height="74" class="item-bg" rx="14"/>
    <rect width="50" height="50" x="15" y="12" class="icon-bg" fill="#3776AB"/>
    <text x="40" y="37" class="icon-letter">Py</text>
    <text x="80" y="45" class="item-title">Python: AI &amp; Neural Computing</text>
  </g>

  <!-- Java -->
  <g transform="translate(75, 575)">
    <rect width="390" height="74" class="item-bg" rx="14"/>
    <rect width="50" height="50" x="15" y="12" class="icon-bg" fill="#ED8B00"/>
    <text x="40" y="37" class="icon-letter">Jv</text>
    <text x="80" y="45" class="item-title">Java: Distributed Architectures</text>
  </g>

  <!-- Kotlin -->
  <g transform="translate(75, 670)">
    <rect width="390" height="74" class="item-bg" rx="14"/>
    <rect width="50" height="50" x="15" y="12" class="icon-bg" fill="#7F52FF"/>
    <text x="40" y="37" class="icon-letter">Kt</text>
    <text x="80" y="45" class="item-title">Kotlin: Native Mobile Engineering</text>
  </g>

  <!-- Rust -->
  <g transform="translate(75, 765)">
    <rect width="390" height="74" class="item-bg" rx="14"/>
    <rect width="50" height="50" x="15" y="12" class="icon-bg" fill="#CE412B"/>
    <text x="40" y="37" class="icon-letter">Rs</text>
    <text x="80" y="45" class="item-title">Rust: Memory-Safe Innovation</text>
  </g>

  <!-- Right Column -->
  <!-- Web Infrastructure -->
  <rect x="520" y="220" width="430" height="230" class="card" stroke="#0ea5e9" stroke-width="2" rx="20"/>
  <text x="545" y="265" class="section-label">Web Ecosystem</text>

  <g transform="translate(545, 290)">
    <rect width="35" height="35" class="icon-bg" fill="#000000"/>
    <text x="17" y="18" class="icon-letter" font-size="12">N</text>
    <text x="45" y="25" class="item-title">Next.js 15: Server Components</text>
  </g>
  <g transform="translate(545, 350)">
    <rect width="35" height="35" class="icon-bg" fill="#0769AD"/>
    <text x="17" y="18" class="icon-letter" font-size="11">jQ</text>
    <text x="45" y="25" class="item-title">jQuery: Legacy Dominance</text>
  </g>
  <g transform="translate(545, 410)">
    <rect width="35" height="35" class="icon-bg" fill="#E34F26"/>
    <text x="17" y="18" class="icon-letter" font-size="11">H5</text>
    <text x="45" y="25" class="item-title">HTML5: Semantic Standards</text>
  </g>

  <!-- Data & Persistence -->
  <rect x="520" y="470" width="430" height="170" class="card" stroke="#10b981" stroke-width="2" rx="20"/>
  <text x="545" y="515" class="section-label">Data &amp; Persistence</text>

  <g transform="translate(545, 540)">
    <rect width="35" height="35" class="icon-bg" fill="#4479A1"/>
    <text x="17" y="18" class="icon-letter" font-size="11">My</text>
    <text x="45" y="25" class="item-title">MySQL / PHP: Fullstack Core</text>
  </g>
  <g transform="translate(545, 600)">
    <rect width="35" height="35" class="icon-bg" fill="#47A248"/>
    <text x="17" y="18" class="icon-letter" font-size="11">M</text>
    <text x="45" y="25" class="item-title">MongoDB: Schema-less Growth</text>
  </g>

  <!-- Runtime & Tools -->
  <rect x="520" y="660" width="430" height="230" class="card" stroke="#22d3ee" stroke-width="2" rx="20"/>
  <text x="545" y="705" class="section-label">Runtime &amp; Tools</text>

  <g transform="translate(545, 730)">
    <rect width="35" height="35" class="icon-bg" fill="#339933"/>
    <text x="17" y="18" class="icon-letter" font-size="11">N</text>
    <text x="45" y="25" class="item-title">Node.js: V8 Performance</text>
  </g>
  <g transform="translate(545, 790)">
    <rect width="35" height="35" class="icon-bg" fill="#3DDC84"/>
    <text x="17" y="18" class="icon-letter" font-size="11" fill="#000000">A</text>
    <text x="45" y="25" class="item-title">Android SDK: Mobile Reach</text>
  </g>
  <g transform="translate(545, 850)">
    <rect width="35" height="35" class="icon-bg" fill="#FCC624"/>
    <text x="17" y="18" class="icon-letter" font-size="11" fill="#000000">L</text>
    <text x="45" y="25" class="item-title">Linux: Infrastructure Kernel</text>
  </g>

  <!-- Sparkle flourish -->
  <path d="M930 930 L940 910 L950 930 L970 940 L950 950 L940 970 L930 950 L910 940 Z" fill="#ffffff" opacity="0.8" />
</svg>
