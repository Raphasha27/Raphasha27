<svg fill="none" viewBox="0 0 800 120" width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner {
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 12px;
          width: 798px;
          height: 118px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .header {
          background: #161b22;
          padding: 8px 15px;
          display: flex; gap: 6px;
          border-bottom: 1px solid #30363d;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        .body {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #0d1117 0%, #030712 100%);
        }
        .name-container { position: relative; }
        .name {
          font-family: 'Courier New', monospace;
          font-size: 42px;
          font-weight: 800;
          color: #38bdf8;
          text-transform: uppercase;
          letter-spacing: 2px;
          text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }
        .subtitle {
          font-size: 12px;
          color: #8b949e;
          text-align: center;
          margin-top: 5px;
          letter-spacing: 4px;
          text-transform: uppercase;
        }
      </style>
      <div class="banner">
        <div class="header">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <div class="body">
          <div class="name-container">
            <div class="name">Koketso Raphasha</div>
            <div class="subtitle">Sovereign AI Architect</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
