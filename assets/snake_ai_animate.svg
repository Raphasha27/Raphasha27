<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)" />

  <!-- Food -->
  <circle cx="300" cy="140" r="6" fill="#ef4444">
    <animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite" />
    <animate attributeName="cx" values="300;100;200;340;60;300" dur="20s" repeatCount="indefinite" />
    <animate attributeName="cy" values="140;220;60;240;40;140" dur="20s" repeatCount="indefinite" />
  </circle>

  <!-- Snake Head -->
  <rect x="0" y="0" width="18" height="18" rx="4" fill="#10b981">
    <animateMotion 
      path="M 40,140 H 280 V 140 H 280 V 140 Z" 
      dur="10s" 
      repeatCount="indefinite"
      rotate="auto"
    />
  </rect>

  <!-- Simulated Snake Body (Just a few segments following) -->
  <g opacity="0.8">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#059669">
      <animateMotion path="M 20,140 H 260" begin="0.1s" dur="10s" repeatCount="indefinite" rotate="auto" />
    </rect>
    <rect x="0" y="0" width="14" height="14" rx="4" fill="#047857">
      <animateMotion path="M 0,140 H 240" begin="0.2s" dur="10s" repeatCount="indefinite" rotate="auto" />
    </rect>
  </g>

  <!-- Text Overlay -->
  <text x="20" y="40" font-family="monospace" font-size="12" fill="#10b981" opacity="0.7">
    PATHFINDING: A* EXECUTING...
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </text>
  <text x="20" y="60" font-family="monospace" font-size="10" fill="#8b949e">
    TARGET_COORD: [342, 128]
  </text>
  
  <style>
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.2; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    .scanner {
      width: 100%;
      height: 2px;
      background: #10b981;
      filter: blur(2px);
      animation: scan 4s linear infinite;
    }
  </style>
  <rect x="0" y="0" width="400" height="2" fill="#10b981" opacity="0.2">
    <animate attributeName="y" values="0;300;0" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
