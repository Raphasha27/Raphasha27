<svg fill="none" viewBox="0 0 150 500" width="150" height="500" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes slide-up {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }
    .track {
      animation: slide-up 20s linear infinite;
    }
    .icon-box {
      fill: rgba(255, 255, 255, 0.05);
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    .icon-box:hover {
      fill: rgba(255, 255, 255, 0.15);
      stroke: #00d2ff;
    }
  </style>

  <defs>
    <clipPath id="frame">
      <rect width="150" height="500" />
    </clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0" />
      <stop offset="15%" stop-color="black" stop-opacity="1" />
      <stop offset="85%" stop-color="black" stop-opacity="1" />
      <stop offset="100%" stop-color="black" stop-opacity="0" />
    </linearGradient>
    <mask id="fade-mask">
      <rect width="150" height="500" fill="url(#fade)" />
    </mask>
  </defs>

  <g mask="url(#fade-mask)">
    <g class="track">
      <!-- Row 1 -->
      <g transform="translate(45, 20)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=python" x="10" y="10" width="40" height="40" />
      </g>
      <!-- Row 2 -->
      <g transform="translate(45, 100)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=rust" x="10" y="10" width="40" height="40" />
      </g>
      <!-- Row 3 -->
      <g transform="translate(45, 180)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=ts" x="10" y="10" width="40" height="40" />
      </g>
      <!-- Row 4 -->
      <g transform="translate(45, 260)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=react" x="10" y="10" width="40" height="40" />
      </g>
      <!-- Row 5 -->
      <g transform="translate(45, 340)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=docker" x="10" y="10" width="40" height="40" />
      </g>
      <!-- Row 6 -->
      <g transform="translate(45, 420)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=aws" x="10" y="10" width="40" height="40" />
      </g>

      <!-- Duplicate for looping -->
      <g transform="translate(0, 480)">
        <g transform="translate(45, 20)">
          <rect width="60" height="60" rx="12" class="icon-box" />
          <image href="https://skillicons.dev/icons?i=python" x="10" y="10" width="40" height="40" />
        </g>
        <g transform="translate(45, 100)">
          <rect width="60" height="60" rx="12" class="icon-box" />
          <image href="https://skillicons.dev/icons?i=rust" x="10" y="10" width="40" height="40" />
        </g>
        <g transform="translate(45, 180)">
          <rect width="60" height="60" rx="12" class="icon-box" />
          <image href="https://skillicons.dev/icons?i=ts" x="10" y="10" width="40" height="40" />
        </g>
        <g transform="translate(45, 260)">
          <rect width="60" height="60" rx="12" class="icon-box" />
          <image href="https://skillicons.dev/icons?i=react" x="10" y="10" width="40" height="40" />
        </g>
        <g transform="translate(45, 340)">
          <rect width="60" height="60" rx="12" class="icon-box" />
          <image href="https://skillicons.dev/icons?i=docker" x="10" y="10" width="40" height="40" />
        </g>
        <g transform="translate(45, 420)">
          <rect width="60" height="60" rx="12" class="icon-box" />
          <image href="https://skillicons.dev/icons?i=aws" x="10" y="10" width="40" height="40" />
        </g>
      </g>
    </g>
  </g>
</svg>
