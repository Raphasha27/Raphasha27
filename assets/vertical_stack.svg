<svg fill="none" viewBox="0 0 150 500" width="150" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0d1117" rx="12"/>
  <style>
    @keyframes slide-up {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }
    .track {
      animation: slide-up 20s linear infinite;
    }
    .icon-box {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
    }
  </style>

  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="15%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="85%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>
  </defs>

  <g class="track">
    <!-- Group 1 -->
    <g transform="translate(45, 20)">
      <rect width="60" height="60" rx="12" class="icon-box" />
      <image href="https://skillicons.dev/icons?i=py" x="10" y="10" width="40" height="40" />
    </g>
    <g transform="translate(45, 100)">
      <rect width="60" height="60" rx="12" class="icon-box" />
      <image href="https://skillicons.dev/icons?i=js" x="10" y="10" width="40" height="40" />
    </g>
    <g transform="translate(45, 180)">
      <rect width="60" height="60" rx="12" class="icon-box" />
      <image href="https://skillicons.dev/icons?i=ts" x="10" y="10" width="40" height="40" />
    </g>
    <g transform="translate(45, 260)">
      <rect width="60" height="60" rx="12" class="icon-box" />
      <image href="https://skillicons.dev/icons?i=react" x="10" y="10" width="40" height="40" />
    </g>
    <g transform="translate(45, 340)">
      <rect width="60" height="60" rx="12" class="icon-box" />
      <image href="https://skillicons.dev/icons?i=docker" x="10" y="10" width="40" height="40" />
    </g>
    <g transform="translate(45, 420)">
      <rect width="60" height="60" rx="12" class="icon-box" />
      <image href="https://skillicons.dev/icons?i=aws" x="10" y="10" width="40" height="40" />
    </g>

    <!-- Duplicate for looping -->
    <g transform="translate(0, 480)">
      <g transform="translate(45, 20)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=py" x="10" y="10" width="40" height="40" />
      </g>
      <g transform="translate(45, 100)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=js" x="10" y="10" width="40" height="40" />
      </g>
      <g transform="translate(45, 180)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=ts" x="10" y="10" width="40" height="40" />
      </g>
      <g transform="translate(45, 260)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=react" x="10" y="10" width="40" height="40" />
      </g>
      <g transform="translate(45, 340)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=docker" x="10" y="10" width="40" height="40" />
      </g>
      <g transform="translate(45, 420)">
        <rect width="60" height="60" rx="12" class="icon-box" />
        <image href="https://skillicons.dev/icons?i=aws" x="10" y="10" width="40" height="40" />
      </g>
    </g>
  </g>

  <!-- Overlay Fades -->
  <rect width="150" height="500" fill="url(#fade)" pointer-events="none" />
</svg>
