<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .marquee {
          display: flex;
          overflow: hidden;
          user-select: none;
          gap: 40px;
          mask-image: linear-gradient(to right, hsl(0 0% 0% / 0), hsl(0 0% 0% / 1) 10%, hsl(0 0% 0% / 1) 90%, hsl(0 0% 0% / 0));
        }
        .marquee-content {
          flex-shrink: 0;
          display: flex;
          justify-content: space-around;
          gap: 40px;
          min-width: 100%;
          animation: scroll 30s linear infinite;
        }
        @keyframes scroll {
          from { transform: translateX(0); }
          to { transform: translateX(calc(-100% - 40px)); }
        }
        img {
          width: 50px;
          height: 50px;
          filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
      </style>
      <div class="marquee">
        <ul class="marquee-content">
          <li><img src="https://skillicons.dev/icons?i=cpp" /></li>
          <li><img src="https://skillicons.dev/icons?i=docker" /></li>
          <li><img src="https://skillicons.dev/icons?i=postgres" /></li>
          <li><img src="https://skillicons.dev/icons?i=nodejs" /></li>
          <li><img src="https://skillicons.dev/icons?i=tensorflow" /></li>
          <li><img src="https://skillicons.dev/icons?i=aws" /></li>
          <li><img src="https://skillicons.dev/icons?i=python" /></li>
          <li><img src="https://skillicons.dev/icons?i=js" /></li>
          <li><img src="https://skillicons.dev/icons?i=react" /></li>
          <li><img src="https://skillicons.dev/icons?i=html" /></li>
          <li><img src="https://skillicons.dev/icons?i=css" /></li>
          <li><img src="https://skillicons.dev/icons?i=dotnet" /></li>
        </ul>
        <ul class="marquee-content" aria-hidden="true">
          <li><img src="https://skillicons.dev/icons?i=cpp" /></li>
          <li><img src="https://skillicons.dev/icons?i=docker" /></li>
          <li><img src="https://skillicons.dev/icons?i=postgres" /></li>
          <li><img src="https://skillicons.dev/icons?i=nodejs" /></li>
          <li><img src="https://skillicons.dev/icons?i=tensorflow" /></li>
          <li><img src="https://skillicons.dev/icons?i=aws" /></li>
          <li><img src="https://skillicons.dev/icons?i=python" /></li>
          <li><img src="https://skillicons.dev/icons?i=js" /></li>
          <li><img src="https://skillicons.dev/icons?i=react" /></li>
          <li><img src="https://skillicons.dev/icons?i=html" /></li>
          <li><img src="https://skillicons.dev/icons?i=css" /></li>
          <li><img src="https://skillicons.dev/icons?i=dotnet" /></li>
        </ul>
      </div>
    </div>
  </foreignObject>
</svg>
