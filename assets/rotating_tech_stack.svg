<svg fill="none" viewBox="0 0 800 120" width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          width: 800px;
          height: 120px;
          display: flex;
          justify-content: center;
          align-items: center;
          perspective: 1000px;
        }
        .tech-stack {
          display: flex;
          gap: 10px;
          animation: rotate-slow 15s ease-in-out infinite;
          transform-style: preserve-3d;
        }
        @keyframes rotate-slow {
          0% { transform: rotateY(-15deg) rotateX(5deg); }
          50% { transform: rotateY(15deg) rotateX(-5deg); }
          100% { transform: rotateY(-15deg) rotateX(5deg); }
        }
        .tech-stack img {
          filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
          transition: transform 0.3s;
        }
        .tech-stack img:hover {
          transform: scale(1.1) translateZ(20px);
        }
      </style>
      <div class="container">
        <div class="tech-stack">
          <img src="https://skillicons.dev/icons?i=cs,dotnet,redis,docker,kubernetes,grafana,prometheus,python,react,nextjs,tailwind,aws,azure,git,github,vscode&amp;perline=16" alt="Tech Stack" />
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
