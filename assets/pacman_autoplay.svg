<svg width="420" height="240" viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg" style="background: black;">
  <!-- Map Background -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="white" opacity="0.5" />
    </pattern>
    <mask id="dotMask">
       <rect width="100%" height="100%" fill="white" />
       <!-- Animated Pacman Mask to "eat" dots -->
       <circle r="15" fill="black">
         <animateTransform attributeName="transform" type="translate" 
            values="30,30; 390,30; 390,210; 30,210; 30,30" 
            dur="8s" repeatCount="indefinite" />
       </circle>
    </mask>
  </defs>

  <!-- Walls (Blue Grid) -->
  <g stroke="blue" stroke-width="20" stroke-linecap="square" fill="none">
    <!-- Border -->
    <rect x="10" y="10" width="400" height="220" />
    <!-- Internal Blocks (Simplified from user map) -->
    <path d="M 60 60 H 120 M 160 60 H 260 M 300 60 H 360" stroke-width="16" />
    <path d="M 60 100 V 140 M 360 100 V 140" stroke-width="16" />
    <path d="M 120 120 H 300" stroke-width="16" />
    <path d="M 60 180 H 360" stroke-width="16" />
  </g>
  
  <!-- Dots (Masked so they disappear) -->
  <rect x="20" y="20" width="380" height="200" fill="url(#grid)" mask="url(#dotMask)" />

  <!-- Pacman -->
  <g transform="translate(30,30)">
    <animateTransform attributeName="transform" type="translate" 
      values="30,30; 390,30; 390,210; 30,210; 30,30" 
      dur="8s" repeatCount="indefinite" />
      
    <path fill="yellow">
      <animate attributeName="d" 
        values="M0,0 L10,-5 A11,11 0 1,0 10,5 Z; M0,0 L10,-1 A11,11 0 1,0 10,1 Z; M0,0 L10,-5 A11,11 0 1,0 10,5 Z" 
        dur="0.4s" repeatCount="indefinite" />
      <!-- Rotation logic approximated via multiple rotates or just simplified path changes. 
           For simplicity in SVG 1.1, we keep typical rotation fixed or imply movement -->
      <animateTransform attributeName="transform" type="rotate"
         values="0; 0; 90; 90; 180; 180; 270; 270; 360"
         keyTimes="0; 0.24; 0.25; 0.49; 0.50; 0.74; 0.75; 1"
         dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Ghost (Red) -->
  <g transform="translate(210,120)">
    <animateTransform attributeName="transform" type="translate" 
       values="210,120; 210,30; 100,30; 100,210; 300,210; 300,120; 210,120" 
       dur="10s" repeatCount="indefinite" />
       
    <path d="M-10,0 L-10,-8 A10,10 0 1,1 10,-8 L10,0 L6,-3 L3,0 L0,-3 L-3,0 L-6,-3 Z" fill="red" />
    <circle cx="-4" cy="-6" r="3" fill="white" />
    <circle cx="4" cy="-6" r="3" fill="white" />
    <circle cx="-4" cy="-6" r="1.5" fill="blue" />
    <circle cx="4" cy="-6" r="1.5" fill="blue" />
  </g>

  <!-- Overlay Text -->
  <text x="50%" y="235" fill="yellow" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.8">
    AUTOPLAYING SIMULATION
  </text>
  <text x="10" y="20" fill="white" font-family="monospace" font-size="12">
    SCORE: <tspan fill="yellow">650</tspan>
  </text>
</svg>
